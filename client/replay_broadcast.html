  // shared chrome — chrome_common.js)

  // The server ships the static minimap wall silhouette ONCE (RLE of a coarse
  // floor/stone/glass grid). Decode it into an offscreen canvas keyed to the
  // arena, so the tactical map blits terrain in one drawImage per frame instead
  // of re-rasterizing the grid. Cached for the whole match.
  var fpMapMeta = null, fpMapBaked = null;
  function ingestFpMap(s) {
    if (!s.fpmap || fpMapBaked) return;
    var m = s.fpmap, gw = m.gw, gh = m.gh, rle = m.rle || [];
    var off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    var octx = off.getContext('2d');
    var img = octx.createImageData(gw, gh);
    var data = img.data;
    // Palette: floor = transparent (the inset's own dark shows through), stone =
    // warm slate, glass = pale translucent pane so see-through cover reads.
    var pal = [
      [0, 0, 0, 0],            // 0 floor
      [92, 78, 62, 235],       // 1 stone
      [150, 172, 178, 150]     // 2 glass
    ];
    var cell = 0;
    for (var k = 0; k + 1 < rle.length; k += 2) {
      var st = rle[k], run = rle[k + 1], c = pal[st] || pal[0];
      for (var r = 0; r < run; r++) {
        var p = (cell + r) * 4;
        data[p] = c[0]; data[p + 1] = c[1]; data[p + 2] = c[2]; data[p + 3] = c[3];
      }
      cell += run;
    }
    octx.putImageData(img, 0, 0);
    fpMapMeta = { w: m.w, h: m.h, gw: gw, gh: gh };
    fpMapBaked = off;
  }

  // ---------- scorebug ----------
  // One pip per PLAYER (8), keyed by stable join slot. Each pip is a pie of
  // that seat's remaining lives (wedge = lives / max, clockwise from 12):
  // full square = all lives, a sliver = last life, dim = down but respawning,
  // hollow = eliminated. The strip is the "who's left" read (the roster IS
  // the counter); the numeral is the exact lives count. Each pip is clickable
  // → POV lens. NEVER shows kills (F1: kills ≠ score).
  // p.lives counts SPARE respawns — the current life is the alive flag — so a
  // seat's lives-left is lives + (alive ? 1 : 0), matching the team numeral.
  // Max isn't in the stream, so refine it up from the observed roster: frame
  // one shows every seat at full config lives, locking the right value.
  var squadMaxLives = 1;
  function seatLivesLeft(p) {
    return (p.lives || 0) + (p.alive ? 1 : 0);
  }
  function renderSquad(el, s, team, pov) {
    // The pip strip IS the team's life meter, grouped by policy: each policy's
    // pips sit in one .squad-pol block with that policy's perk badges beside
    // them. CTF-Doubles (two policies) mirrors WITHIN the strip — the two pip
    // groups sit adjacent at its center with each policy's badges flanking
    // OUTSIDE its own group — while the group order stays the headline's
    // left-to-right policy order on both plates, so a badge always sits on
    // the side of the name it belongs to. Persistent DOM keyed by seats +
    // perks; pips update in place every frame.
    var groups = teamPerkGroups(s, team);
    var split = groups.length === 2;
    var key = groups.map(function (g) {
      return g.pol + '=' + (g.perks || []).join('+') + ':' +
        g.players.map(function (p) { return p.s; }).join(',');
    }).join('|');
    if (el._key !== key) {
      el.innerHTML = ''; el._pips = {};
      groups.forEach(function (g, gi) {
        var block = document.createElement('span');
        block.className = 'squad-pol';
        var iconsFirst = split && gi === 0;
        var icos = null;
        if (g.perks && g.perks.length) {
          icos = document.createElement('span');
          icos.className = 'perk-icos';
          icos.innerHTML = perkIconsHtml(g.perks, s.pmods);
        }
        if (icos && iconsFirst) block.appendChild(icos);
        g.players.forEach(function (p) {
          var pip = document.createElement('span');
          pip.className = 'squad-pip';
          pip.title = shortName(p.name);
          pip.addEventListener('click', function () { togglePov(p.s); });
          block.appendChild(pip);
          el._pips[p.s] = pip;
        });
        if (icos && !iconsFirst) block.appendChild(icos);
        el.appendChild(block);
      });
      el._key = key;
    }
    var players = [];
    groups.forEach(function (g) { players = players.concat(g.players); });
    players.forEach(function (p) {
      if (seatLivesLeft(p) > squadMaxLives) squadMaxLives = seatLivesLeft(p);
    });
    players.forEach(function (p) {
      var pip = el._pips[p.s];
      if (!pip) return;
      var eliminated = !p.alive && p.lives <= 0;
      var fill = Math.max(0, Math.min(1, seatLivesLeft(p) / squadMaxLives));
      if (pip._fill !== fill) {
        pip.style.setProperty('--fill', String(fill));
        pip._fill = fill;
      }
      pip.classList.toggle('down', !p.alive && p.lives > 0);
      pip.classList.toggle('out', eliminated);
      pip.classList.toggle('carry', !!p.carry);
      pip.classList.toggle('pov', pov === p.s);
    });
  }

  // Rebuild the scorebug plates when the active team set changes (once per
  // match in practice). Plates alternate sides in TEAM_ORDER — index 0/2 left,
  // 1/3 right — so both team names stay innermost, flanking the clock.
  var sbTeams = null;
  function ensureScorebug(teams) {
    // Keyed on team set AND mode: paintball frames arrive after the first
    // classic-built frame, so the plates rebuild once when the mode is known.
    var key = teams.join(',') + (MC_MODE ? '|pb' : '');
    if (sbTeams === key) return;
    sbTeams = key;
    var sides = [$('plates-l'), $('plates-r')];
    sides[0].innerHTML = '';
    sides[1].innerHTML = '';
    sides[0].classList.toggle('row', teams.length > 2);
    sides[1].classList.toggle('row', teams.length > 2);
    teams.forEach(function (team, i) {
      var plate = document.createElement('div');
      plate.className = 'plate ' + team + ' ' + (i % 2 === 0 ? 'side-l' : 'side-r');
      plate.setAttribute('data-team', team);
      if (MC_MODE) {
        // PAINTBALL: the plate's CONTENTS change (hill time held, live hill
        // coverage, tag-outs) — the plate, the sides, the squad strip and the
        // clock column are the classic ones. The heart/flag icon is gone with
        // the objective it belonged to.
        plate.innerHTML =
          '<div class="hillchip" id="hill-' + team + '" title="Hill coverage">—</div>' +
          '<div class="team-id">' +
          '<div class="lives-line">' +
          '<span class="team-name plate-name" id="name-' + team + '">' + team.toUpperCase() + '</span>' +
          '<span class="hcap" id="hcap-' + team + '" style="display:none"></span>' +
          '<span class="lives-label pb-lbl">Hill</span>' +
          '<span class="lives-num" id="lives-' + team + '">—</span>' +
          '</div>' +
          '<div class="pb-sub">' +
          '<span class="pb-tags pb-lbl" id="tags-' + team + '"></span>' +
          '<span class="squad" id="squad-' + team + '"></span>' +
          '</div>' +
          '</div>';
        sides[i % 2].appendChild(plate);
        return;
      }
      plate.innerHTML =
        '<div class="flagicon" id="flag-' + team + '"></div>' +
        '<div class="team-id">' +
        '<div class="lives-line">' +
        '<span class="team-name" id="name-' + team + '">' + team.toUpperCase() + '</span>' +
        '<span class="hcap" id="hcap-' + team + '" style="display:none"></span>' +
        '<span class="lives-label">Lives</span>' +
        '<span class="lives-num" id="lives-' + team + '">—</span>' +
        '</div>' +
        '<div class="squad" id="squad-' + team + '"></div>' +
        '</div>';
      sides[i % 2].appendChild(plate);
      buildFlag($('flag-' + team), teamCol(team) || AMBER);
    });
  }

  function renderScorebug(s) {
    var teams = activeTeams(s);
    ensureScorebug(teams);
    var tr = s.teams || {};
    var lives = {};
    teams.forEach(function (team) {
      lives[team] = (tr[team] && tr[team].lives) || 0;
    });

    teams.forEach(function (team) {
      setName('name-' + team, teamName(s, team, team.toUpperCase()));
      setHandicap('hcap-' + team, s, team);
      if (MC_MODE) {
        var t = tr[team] || {};
        // PAINTBALL: the big numeral is HILL TIME HELD (M:SS), the chip is
        // live hill coverage, and the sub-line counts tag-outs. '—' until the
        // frame actually carries this team's entry.
        $('lives-' + team).textContent = tr[team] ? fmt(t.held || 0) : '—';
        var chip = $('hill-' + team);
        if (chip) {
          chip.textContent = tr[team] ? (t.cov || 0) + '%' : '—';
          chip.classList.toggle('own', !!t.own);
          chip.style.color = teamCol(team) || PAPER;
        }
        var tagsEl = $('tags-' + team);
        if (tagsEl) {
          tagsEl.textContent = tr[team]
            ? (t.tags || 0) + ' tags · ' + (t.cogs || 0) + ' up' : '';
        }
        renderSquad($('squad-' + team), s, team, s.pov);
        // leader pulse when this team leads every rival on banked hill time
        var bestPbRival = -Infinity;
        teams.forEach(function (o) {
          if (o !== team) bestPbRival = Math.max(bestPbRival, (tr[o] && tr[o].held) || 0);
        });
        var pbPlate = document.querySelector('.plate[data-team="' + team + '"]');
        if (pbPlate) {
          pbPlate.classList.toggle(
            'leader',
            (t.held || 0) - bestPbRival >= 5 && s.ph === 'playing'
          );
        }
        return;
      }
      // '—' until the frame actually carries this team's entry (a pre-roster
      // frame would otherwise read as a real 0). Matches the league shell.
      $('lives-' + team).textContent = tr[team] ? lives[team] : '—';
      // Squad pips grouped by policy with perk badges around each group
      // (the pip strip is the life meter; see renderSquad).
      renderSquad($('squad-' + team), s, team, s.pov);
      updateFlag('flag-' + team, team, tr[team] || {}, s);
      // leader pulse when this team leads EVERY rival by >= 3
      var bestRival = -Infinity;
      teams.forEach(function (o) {
        if (o !== team) bestRival = Math.max(bestRival, lives[o]);
      });
      var plate = document.querySelector('.plate[data-team="' + team + '"]');
      if (plate) {
        plate.classList.toggle(
          'leader',
          lives[team] - bestRival >= 3 && s.ph === 'playing'
        );
      }
    });
  }

  // (stripSeatSuffix / teamPolicies / teamName / teamHeadline / setName live
  // in the shared chrome — chrome_common.js)

  function updateFlag(id, team, tstate, s) {
    var el = $(id);
    /* GV32: 'captured' (heart retired, team eliminated) shows as off-pedestal
       like 'taken' — the carrier tag stays empty since nobody carries it. */
    var taken = tstate.flag === 'taken' || tstate.flag === 'captured';
    var was = el.classList.contains('taken');
    el.classList.toggle('taken', taken);
    if (was !== taken) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
    var tag = el.querySelector('.carrier-tag');
    if (tag) {
      if (taken && tstate.carrier >= 0) {
        tag.textContent = shortName(rosterName(s, tstate.carrier));
      } else { tag.textContent = ''; }
    }
  }

  function shortName(n) {
    n = String(n || '');
    // Names are player addresses; keep them short + readable.
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    if (n.length > 10) n = n.slice(0, 10);
    return n || '?';
  }

  // (clock, transport and lull shading live in the shared chrome —
  // chrome_common.js: fmt / renderClock / renderTransport / renderLullSpans)

  // ---------- pov + mismatch ----------
  function renderPov(s) {
    // MINECRAFT: #povBadge is removed. The kept #fpv panel is repurposed as the
    // cog's own egocentric window and is drawn by the appended game block.
    renderFpv(s);
  }

  // First-person picture-in-picture: draw the selected seat's raycast view into
  // the bottom-right inset. Wolfenstein-style — each column is one wall slice
  // whose height is inversely proportional to distance (walls are "full-screen
  // high" so an enemy running across the mouth of a lane reads as a figure
  // sweeping between wall faces), with billboarded soldiers/hearts drawn on top.
  var fpvEl = $('fpv'), fpvCanvas = $('fpv-canvas'), fpvCtx = null;

  // Drag-to-reposition the first-person inset. Grab it anywhere; we pin via
  // left/top (dropping the right/bottom anchor) and clamp inside the stage so it
  // can never be dragged off-screen. Purely a viewer convenience — no state sent.
  // Drag the inset anywhere to reposition; drag the corner grip to resize. The
  // FPV keeps a 3:2 aspect on resize. Both pin via left/top+width once used, so
  // the CSS right/bottom/aspect anchors are dropped. Purely a viewer convenience.
  (function makeFpvInteractive() {
    var grip = $('fpv-grip');
    var mode = null;                       // 'move' | 'resize' | null
    var startX = 0, startY = 0, baseLeft = 0, baseTop = 0, baseW = 0, baseH = 0;
    var FPV_ASPECT = 3 / 2, MINW = 150;

    function beginPin() {
      var rect = fpvEl.getBoundingClientRect();
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      baseLeft = rect.left - host.left;
      baseTop = rect.top - host.top;
      baseW = rect.width; baseH = rect.height;
      fpvEl.classList.add('moved', 'sized');
      fpvEl.style.left = baseLeft + 'px';
      fpvEl.style.top = baseTop + 'px';
      fpvEl.style.width = baseW + 'px';
      fpvEl.style.height = baseH + 'px';
    }

    grip.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      beginPin();
      mode = 'resize';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('resizing');
      grip.setPointerCapture(ev.pointerId);
      ev.preventDefault(); ev.stopPropagation();
    });

    fpvEl.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0 || mode) return;
      beginPin();
      mode = 'move';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('dragging');
      fpvEl.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });

    function onMove(ev) {
      if (!mode) return;
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      if (mode === 'move') {
        var nx = baseLeft + (ev.clientX - startX);
        var ny = baseTop + (ev.clientY - startY);
        nx = Math.max(0, Math.min(nx, host.width - fpvEl.offsetWidth));
        ny = Math.max(0, Math.min(ny, host.height - fpvEl.offsetHeight));
        fpvEl.style.left = nx + 'px';
        fpvEl.style.top = ny + 'px';
      } else {
        // Grip is bottom-RIGHT: dragging right/down grows it, keeping the
        // top-LEFT corner (baseLeft, baseTop) fixed. Clamp to the host and a
        // sane min/max.
        var nw = baseW + (ev.clientX - startX);
        nw = Math.max(MINW, Math.min(nw, host.width - baseLeft, host.width * 0.9));
        var nh = nw / FPV_ASPECT;
        var maxH = host.height * 0.9;
        if (nh > maxH) { nh = maxH; nw = nh * FPV_ASPECT; }
        fpvEl.style.width = nw + 'px';
        fpvEl.style.height = nh + 'px';
        // left/top stay fixed (baseLeft, baseTop)
      }
    }
    function endAll(ev) {
      if (!mode) return;
      mode = null;
      fpvEl.classList.remove('dragging', 'resizing');
      try { fpvEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      try { grip.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    fpvEl.addEventListener('pointermove', onMove);
    grip.addEventListener('pointermove', onMove);
    fpvEl.addEventListener('pointerup', endAll);
    fpvEl.addEventListener('pointercancel', endAll);
    grip.addEventListener('pointerup', endAll);
    grip.addEventListener('pointercancel', endAll);
  })();

  // Column distance can be a scalar stone hit or a [stoneHit, glassDist] pair
  // (glass is see-through, so it rides in front of the stone behind it).
  function colStone(c) { return (c instanceof Array) ? c[0] : c; }
  function colGlass(c) { return (c instanceof Array) ? c[1] : -1; }

  // --- raycaster projection constants (real FPS math) ---
  // A world object of height WALL_H at perpendicular distance d projects to
  // (PROJ * WALL_H / d) screen px, where PROJ = (W/2)/tan(halfFov). This is the
  // exact pinhole-camera relation Wolf3D/DOOM use, so near walls tower and far
  // walls shrink smoothly — real depth, not a clamp. WALL_H is the corridor wall
  // height in world px; tuned so a wall ~one corridor away fills the frame.
  var FPV_WALL_H = 150;      // world px: conceptual corridor wall height
  // The camera eye sits at half a wall's height (walls are drawn centered on the
  // horizon), so the visible FLOOR at distance d is horizon + projH(FPV_EYE, d).
  // Every figure plants its feet on THAT line — no more floating at eye level.
  var FPV_EYE = FPV_WALL_H / 2;
  var FPV_COG_H = 90;        // world px: a cog stands ~0.6x a corridor wall tall
  var FPV_FOG = 900;         // px at which depth shading bottoms out to ink

  // --- paintball comet tracers (the board's design, rebuilt in 3D) ---
  // A shot is hitscan: the whole beam exists at once, so it can't literally
  // travel. The board solves this with a COMET (global.nim) and the PiP uses the
  // same visual language so the two views tell one story: a bright paintball
  // HEAD at the impact end, a thin trail fading back toward the muzzle, a muzzle
  // flash marking who fired, and a paint splat where it lands. Hits read bright;
  // misses are pre-faded.
  //
  // Here it's genuinely 3D: the server sends the beam as a polyline of
  // (bearing, range) samples, so the trail is projected point-by-point and
  // narrows with depth like everything else in the raycaster.
  var SHOT_FX_TICKS = WIRE.shotFxTicks || 12;  // sim.nim ShotFxTicks — the beam's lifetime
  var SHOT_MISS_AGE = 4;     // a miss draws this many ticks "older" (dimmer)
  var SHOT_TRAIL_FALLOFF = WIRE.shotTrailFalloff || 1.6;  // trail alpha = t^this
  var SHOT_HEAD_WORLD = 11;  // world px across the leading paintball
  var SHOT_TRAIL_WORLD = 5;  // world px thick at the impact end (tapers to muzzle)
  // Beams fly at roughly chest height, a little below the eye line.
  var SHOT_EYE_DROP = 10;    // world px below eye level the beam travels
  // Perspective divides by depth, so anything at point-blank range projects
  // arbitrarily large. These cap the paint against the inset's HEIGHT so a shot
  // ending at the camera reads as a fat ball / thick streak rather than a
  // full-frame wash of colour (the visor splat is what sells a hit on YOU).
  var SHOT_MAX_HEAD_H = 0.10;    // ball radius ≤ 10% of inset height
  var SHOT_MAX_TRAIL_H = 0.06;   // trail width ≤ 6% of inset height

  // --- paint-splatter-on-hit state ---
  // Tracks the POV seat's last PAINT-hit tick (server-sent self.paintTick) so a
  // fresh paint hit fires a splat; the splat itself is a set of blobs in [0..1]
  // canvas-space with a fire TICK, faded over SPLAT_TICKS so it decays as the
  // replay plays (scrub-safe, wall-clock independent). Keyed on paintTick — NOT
  // raw hp — so the splat tracks PAINT landing on this seat (gun, grenade, and
  // spray can all stamp it) and never fires on a shield bubble eating the hit.
  var fpvPrev = { pov: -1, paint: -1, tick: -1 };
  var fpvSplat = null;
  var SPLAT_TICKS = 30;      // ~1.25s at 24fps: splat lingers then clears
  // Build ONE cohesive, cartoony paint splat: a single main gob with a few small
  // lobes hugging it (an organic outline, not a shotgun-scatter) plus a couple of
  // drips. Anchored OFF-CENTER — one of a handful of side/corner spots — so the
  // view center stays clear. Placed DETERMINISTICALLY off the fire tick (no RNG),
  // so re-scrubbing to the same tick paints the identical splat.
  function makeSplat(tick, color) {
    function rnd(i) { var x = Math.sin((tick * 13.13 + i * 7.77)) * 43758.5453; return x - Math.floor(x); }
    // Off-center anchors: four corners + two side-mids. Never the center, so the
    // action stays readable through the splash.
    var anchors = [
      { x: 0.26, y: 0.30 }, { x: 0.74, y: 0.30 },
      { x: 0.26, y: 0.70 }, { x: 0.74, y: 0.70 },
      { x: 0.20, y: 0.50 }, { x: 0.80, y: 0.50 }
    ];
    var a = anchors[Math.floor(rnd(0) * anchors.length) % anchors.length];
    var mainR = 0.15 + rnd(1) * 0.04;
    var blobs = [{ x: a.x, y: a.y, r: mainR, drip: 0.8 + rnd(2) * 0.5 }];
    // 3–4 satellite lobes hugging the main gob so the silhouette reads as ONE
    // torn splat, not many separate hits.
    var count = 3 + Math.floor(rnd(3) * 2);
    for (var i = 0; i < count; i++) {
      var ang = rnd(i * 3 + 4) * Math.PI * 2;
      blobs.push({
        x: a.x + Math.cos(ang) * mainR * (0.7 + rnd(i * 3 + 5) * 0.5),
        y: a.y + Math.sin(ang) * mainR * (0.6 + rnd(i * 3 + 6) * 0.5),
        r: mainR * (0.32 + rnd(i * 3 + 7) * 0.34),
        drip: rnd(i * 5 + 8) * 0.7
      });
    }
    return { tick: tick, color: color, blobs: blobs, cx: a.x, cy: a.y, mainR: mainR };
  }

  function renderFpv(s) {
    var show = s.pov >= 0 && s.fp && s.fp.cols;
    fpvEl.classList.toggle('on', !!show);
    if (!show) return;
    if (!fpvCtx) fpvCtx = fpvCanvas.getContext('2d');

    var fp = s.fp;

    // Paint-splatter-on-hit: when the POV cog takes a PAINT hit — paintball gun,
    // grenade, or a spray can in the face; the server stamps self.paintTick for
    // all three — splash the enemy team's paint across the "visor".
    // Keyed + faded by TICK (not wall-clock) so it is replay-deterministic and
    // scrub-safe. A new paint hit replaces any fading splat.
    var self = fp.self;
    if (self) {
      var jump = fpvPrev.tick < 0 || s.t < fpvPrev.tick || (s.t - fpvPrev.tick) > 6;
      var paint = (typeof self.paintTick === 'number') ? self.paintTick : -1;
      if (s.pov !== fpvPrev.pov || jump) {
        // POV change or scrub/loop: resync baseline, don't fire, drop stale splat.
        fpvSplat = null;
      } else if (paint >= 0 && paint !== fpvPrev.paint && paint <= s.t) {
        // A fresh paint hit landed on the POV seat → enemy paint hits the
        // screen. With one rival team the paint is theirs; with 2-3 rivals the
        // shooter is unknowable from this frame, so neutral amber stands in.
        var rivals = activeTeams(s).filter(function (t) { return t !== self.team; });
        var enemyCol = rivals.length === 1 ? (teamCol(rivals[0]) || AMBER) : AMBER;
        fpvSplat = makeSplat(paint, enemyCol);
      }
      fpvPrev.pov = s.pov;
      fpvPrev.paint = paint;
      fpvPrev.tick = s.t;
    }

    var cols = fp.cols, n = cols.length;
    var dpr = window.devicePixelRatio || 1;
    var cssW = fpvCanvas.clientWidth || 200, cssH = fpvCanvas.clientHeight || 133;
    var W = Math.max(1, Math.round(cssW * dpr)), H = Math.max(1, Math.round(cssH * dpr));
    if (fpvCanvas.width !== W) fpvCanvas.width = W;
    if (fpvCanvas.height !== H) fpvCanvas.height = H;
    var ctx = fpvCtx;
    ctx.imageSmoothingEnabled = false;

    var horizon = H * 0.5;
    // Projection scale from the real half-FOV (server-sent, in brads → radians).
    var halfFov = (fp.hfov != null ? fp.hfov : 128 * (60 / 180)) * Math.PI / 128;
    var PROJ = (W / 2) / Math.tan(Math.max(0.15, halfFov));

    // Ceiling (upper) over floor (lower): darker at the horizon line, lifting
    // toward the frame edges — a subtle vertical gradient reads as depth even on
    // empty lanes. Near-black warm ink, distinct from wall stone.
    var ceil = ctx.createLinearGradient(0, 0, 0, horizon);
    ceil.addColorStop(0, '#20180f'); ceil.addColorStop(1, '#0d0a06');
    ctx.fillStyle = ceil; ctx.fillRect(0, 0, W, horizon);
    var floor = ctx.createLinearGradient(0, horizon, 0, H);
    floor.addColorStop(0, '#0d0a06'); floor.addColorStop(1, '#241a10');
    ctx.fillStyle = floor; ctx.fillRect(0, horizon, W, H - horizon);

    // Per-column wall DEPTH z-buffer (perpendicular distance to the nearest
    // OPAQUE wall in that column, Infinity for open sky). Sprites test against
    // this so a cog behind a pillar is clipped. Glass is see-through → it does
    // NOT write depth (you can shoot-block on it but you can see past it).
    var colW = W / n;
    var zbuf = new Array(n);
    function projH(worldH, d) { return PROJ * worldH / Math.max(4, d); }

    for (var i = 0; i < n; i++) {
      var x = Math.round(i * colW);
      var w = Math.ceil(colW) + 1;
      var dist = colStone(cols[i]);
      zbuf[i] = dist >= 0 ? dist : Infinity;
      if (dist >= 0) {
        var h = projH(FPV_WALL_H, dist);
        var top = horizon - h / 2;
        // Depth shading: near = warm lit stone, far = sink to ink. Exponential-ish
        // falloff over corridor distances gives a legible near/far ramp.
        var lit = Math.max(0.12, 1 - dist / FPV_FOG);
        lit = lit * lit;                          // steepen so pillars pop forward
        // Vertical-edge shading: darken columns whose neighbour is much nearer/
        // farther — that depth discontinuity is a WALL CORNER; a seam sells 3D.
        var seam = 1;
        if (i > 0 && i < n - 1) {
          var dl = colStone(cols[i - 1]), dr = colStone(cols[i + 1]);
          var jump = Math.max(
            dl >= 0 ? Math.abs(dist - dl) : 0,
            dr >= 0 ? Math.abs(dist - dr) : 0);
          if (jump > 40) seam = 0.55;             // dark ink line at the corner
        }
        var r = Math.round((150 * lit + 26) * seam);
        var g = Math.round((116 * lit + 18) * seam);
        var b = Math.round((84 * lit + 12) * seam);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x, top, w, h);
        // A soft top-edge highlight + bottom shadow give the slab thickness.
        ctx.fillStyle = 'rgba(255,236,200,' + (0.10 * lit).toFixed(3) + ')';
        ctx.fillRect(x, top, w, Math.max(1, h * 0.04));
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x, top + h - Math.max(1, h * 0.05), w, Math.max(1, h * 0.05));
      }
      // Glass pane: translucent slice in front (drawn over stone, no depth write).
      var gd = colGlass(cols[i]);
      if (gd >= 0) {
        var gh = projH(FPV_WALL_H, gd);
        var gtop = horizon - gh / 2;
        var glit = Math.max(0.25, 1 - gd / FPV_FOG);
        ctx.fillStyle = 'rgba(150,178,186,' + (0.26 * glit).toFixed(3) + ')';
        ctx.fillRect(x, gtop, w, gh);
        ctx.fillStyle = 'rgba(226,236,230,' + (0.30 * glit).toFixed(3) + ')';
        ctx.fillRect(x, gtop, w, Math.max(1, gh * 0.05));
      }
    }

    // Sprites: project each entity to its true screen height and column span,
    // then draw column-by-column CLIPPED against the wall z-buffer — a cog behind
    // a nearer wall is hidden per-column, exactly like a real raycaster. Sorted
    // far→near so nearer figures overdraw.
    var ents = (fp.ents || []).slice().sort(function (a, b) { return b.d - a.d; });
    for (var j = 0; j < ents.length; j++) {
      var e = ents[j];
      var ed = Math.max(4, e.d);
      var worldH = (e.k === 'item' || e.k === 'heart') ? FPV_COG_H * 0.55 : FPV_COG_H;
      var figH = projH(worldH, ed);
      // Screen-x from the true view angle: o∈[-1,1] maps across ±halfFov, and the
      // horizontal position is PROJ*tan(angle) — matched to the wall projection.
      var ang = (e.o || 0) * halfFov;
      var ex = W / 2 + PROJ * Math.tan(ang);
      var figW = figH * ((e.k === 'item' || e.k === 'heart') ? 0.85 : 0.9);
      // Plant the figure on the visible FLOOR: the floor at this depth projects to
      // horizon + projH(FPV_EYE, d). Feet sit there; the body rises figH above it.
      // (Previously feet were pinned near the horizon, so cogs floated at eye level.)
      var feetY = horizon + projH(FPV_EYE, ed);
      // Occlusion is a DEPTH test, so compare like-for-like: zbuf holds fisheye-
      // corrected PERPENDICULAR wall distance, while e.d is the RADIAL range to the
      // entity. Convert the entity to perpendicular depth (radial·cos(angle)) before
      // testing, or edge sprites leak through nearer walls.
      var edPerp = ed * Math.cos(ang);
      // Occlusion: clip the sprite to the sub-range of its columns that are NOT
      // blocked by a nearer wall. Draw into a clip rect spanning visible columns.
      var xL = ex - figW / 2, xR = ex + figW / 2;
      var ci0 = Math.max(0, Math.floor(xL / colW));
      var ci1 = Math.min(n - 1, Math.ceil(xR / colW));
      // Build visible x-spans where zbuf (wall depth) is farther than the sprite.
      var spanStart = -1;
      for (var ci = ci0; ci <= ci1 + 1; ci++) {
        var visible = ci <= ci1 && zbuf[ci] > edPerp - 2;   // wall behind sprite → show
        if (visible && spanStart < 0) spanStart = ci;
        else if (!visible && spanStart >= 0) {
          drawFpvEntityClipped(ctx, e, ex, feetY, figH, figW,
            Math.max(xL, spanStart * colW), Math.min(xR, ci * colW));
          spanStart = -1;
        }
      }
    }

    // Paintball comets: drawn AFTER the sprites (paint flies in front of the
    // cogs that fired it) but before the reticle/HUD, which stay on top.
    drawFpvShots(ctx, fp, W, H, horizon, halfFov, PROJ, colW, n, zbuf, projH);

    // Aim reticle at view center.
    ctx.save();
    ctx.strokeStyle = 'rgba(242,232,216,0.55)';
    ctx.lineWidth = Math.max(1, H * 0.006);
    var rc = H * 0.03;
    ctx.beginPath();
    ctx.moveTo(W / 2 - rc, horizon); ctx.lineTo(W / 2 - rc * 0.35, horizon);
    ctx.moveTo(W / 2 + rc * 0.35, horizon); ctx.lineTo(W / 2 + rc, horizon);
    ctx.moveTo(W / 2, horizon - rc); ctx.lineTo(W / 2, horizon - rc * 0.35);
    ctx.moveTo(W / 2, horizon + rc * 0.35); ctx.lineTo(W / 2, horizon + rc);
    ctx.stroke();
    ctx.restore();

    // Paint-splatter overlay: enemy paint splashed across the camera on a hit,
    // fading out over SPLAT_TICKS as the replay advances. Drawn LAST so it sits
    // in front of the world like paint on a visor.
    if (fpvSplat) {
      var age = s.t - fpvSplat.tick;
      if (age < 0 || age > SPLAT_TICKS) { fpvSplat = null; }
      else { drawSplat(ctx, W, H, fpvSplat, 1 - age / SPLAT_TICKS); }
    }

  }

  // Draw the paint splatter: gooey team-colored blobs with soft edges + drips,
  // faded by `life` (1 → fresh, 0 → gone). A quick white rim on the freshest
  // frames reads as a wet impact flash.
  function drawSplat(ctx, W, H, splat, life) {
    if (life <= 0) return;
    ctx.save();
    // ease-out: near-opaque at impact, then fall off. Capped well below 1 so the
    // action still reads through the paint (a splash on the lens, not a
    // blackout) — and since the splat sits off-center, the view center stays clear.
    var a = Math.min(0.7, life * 1.05);
    ctx.globalAlpha = a;
    var col = splat.color;
    for (var i = 0; i < splat.blobs.length; i++) {
      var b = splat.blobs[i];
      var bx = b.x * W, by = b.y * H, br = b.r * Math.min(W, H);
      // soft radial body so edges feather like wet paint
      var g = ctx.createRadialGradient(bx, by, br * 0.15, bx, by, br);
      g.addColorStop(0, col); g.addColorStop(0.7, col);
      g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      // a drip running down from the blob
      if (b.drip > 0.35) {
        var dl = br * (0.8 + b.drip * 1.6);
        var dw = br * 0.32;
        var dg = ctx.createLinearGradient(bx, by, bx, by + dl);
        dg.addColorStop(0, col); dg.addColorStop(1, hexA(col, 0));
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.moveTo(bx - dw, by);
        ctx.quadraticCurveTo(bx - dw * 0.4, by + dl * 0.6, bx, by + dl);
        ctx.quadraticCurveTo(bx + dw * 0.4, by + dl * 0.6, bx + dw, by);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by + dl, dw * 0.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    // wet-impact rim flash on the freshest frames, hugging the main gob
    if (life > 0.72) {
      ctx.globalAlpha = (life - 0.72) / 0.28 * 0.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.006);
      ctx.beginPath();
      ctx.arc(splat.cx * W, splat.cy * H, splat.mainR * Math.min(W, H) * 1.08, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  // #rrggbb → rgba() with alpha a (0..1). Used for feathered paint edges.
  function hexA(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')';
  }

  // A four-lobed heart glyph (two arcs + a point) — the flag/heart icon, matched
  // to the board art rather than a bare diamond.
  function heartPath(ctx, cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.5);
    ctx.bezierCurveTo(cx - s * 0.95, cy - s * 0.15, cx - s * 0.45, cy - s * 0.72, cx, cy - s * 0.22);
    ctx.bezierCurveTo(cx + s * 0.45, cy - s * 0.72, cx + s * 0.95, cy - s * 0.15, cx, cy + s * 0.5);
    ctx.closePath();
  }

  // Item glyphs for the first-person billboards, drawn in a figH-scaled box.
  // `dim` (0..1, default 1) applies depth shading like the wall/cog draws.
  function drawItemGlyph(ctx, kind, cx, cy, r, dim) {
    dim = dim == null ? 1 : dim;
    ctx.save();
    ctx.globalAlpha = Math.max(0.4, dim);
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.strokeStyle = 'rgba(12,8,5,0.9)';
    if (kind === 'grenade') {
      ctx.fillStyle = '#4f6b3a';
      ctx.beginPath(); ctx.arc(cx, cy + r * 0.15, r * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(cx - r * 0.18, cy - r * 0.75, r * 0.36, r * 0.4);
    } else if (kind === 'medkit') {
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.rect(cx - r * 0.62, cy - r * 0.5, r * 1.24, r * 1.0); ctx.fill(); ctx.stroke();
      ctx.fillStyle = RED;
      ctx.fillRect(cx - r * 0.13, cy - r * 0.34, r * 0.26, r * 0.68);
      ctx.fillRect(cx - r * 0.34, cy - r * 0.13, r * 0.68, r * 0.26);
    } else if (kind === 'shield') {
      ctx.fillStyle = '#6fa8d6';
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 0.7);
      ctx.lineTo(cx + r * 0.6, cy - r * 0.4);
      ctx.lineTo(cx + r * 0.42, cy + r * 0.55);
      ctx.lineTo(cx, cy + r * 0.78);
      ctx.lineTo(cx - r * 0.42, cy + r * 0.55);
      ctx.lineTo(cx - r * 0.6, cy - r * 0.4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (kind === 'spray') {
      // Aerosol can: a chunky rounded body with a cream label band, a cap, and a
      // puff of mist at the nozzle — the billboard read of data/spraycan.png.
      // Sized to the same visual weight as the grenade / med kit / shield.
      ctx.fillStyle = '#c8503f';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx - r * 0.44, cy - r * 0.42, r * 0.88, r * 1.06, r * 0.22);
      else ctx.rect(cx - r * 0.44, cy - r * 0.42, r * 0.88, r * 1.06);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = PAPER;
      ctx.fillRect(cx - r * 0.44, cy - r * 0.04, r * 0.88, r * 0.32);
      ctx.strokeRect(cx - r * 0.44, cy - r * 0.04, r * 0.88, r * 0.32);
      ctx.fillStyle = '#7fc4d6';
      ctx.beginPath(); ctx.rect(cx - r * 0.2, cy - r * 0.68, r * 0.4, r * 0.26);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(242,232,216,0.85)';
      ctx.beginPath(); ctx.arc(cx + r * 0.4, cy - r * 0.72, r * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.66, cy - r * 0.58, r * 0.1, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = AMBER;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Draw one billboard entity, CLIPPED to [clipL, clipR] so walls occlude it
  // per-column (real raycaster sprite clipping). figH/figW are the projected
  // size; (cx, feetY) is the sprite's ground contact on the floor.
  function drawFpvEntityClipped(ctx, e, cx, feetY, figH, figW, clipL, clipR) {
    if (clipR <= clipL) return;
    ctx.save();
    ctx.beginPath();
    // Clip band spans the whole standing figure (feetY up figH) plus headroom for
    // hp pips / a carried heart above, and a little below for the contact shadow.
    ctx.rect(clipL, feetY - figH * 2.0, clipR - clipL, figH * 2.4);
    ctx.clip();
    // Depth dim: distant billboards sink toward ink like the walls do.
    var dim = Math.max(0.35, 1 - (e.d || 0) / FPV_FOG);
    drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim);
    ctx.restore();
  }

  // ---- paintball comets in 3D ----
  // The server sends each in-flight beam as a polyline of (bearing o, range d)
  // samples, with nulls where the beam leaves this seat's vision. We project
  // every sample the same way the walls and cogs are projected, so a beam
  // genuinely recedes: the far end converges toward the horizon and thins, the
  // near end is fat and low. That's what makes it read as a shot flying through
  // the room rather than a line drawn on the glass.
  //
  // Shape (matching the board's comet, global.nim): a bright paintball HEAD at
  // the impact end, a trail behind it whose alpha rises as t^SHOT_TRAIL_FALLOFF
  // toward that head, a muzzle flash at the shooter's end, and a wet splat where
  // it lands. Age fades the whole comet over SHOT_FX_TICKS; a miss starts
  // SHOT_MISS_AGE ticks "older" so hits are the ones that pop.
  function drawFpvShots(ctx, fp, W, H, horizon, halfFov, PROJ, colW, n, zbuf,
                        projH) {
    var shots = fp.shots;
    if (!shots || !shots.length) return;

    // Project one sample to screen space. The beam rides SHOT_EYE_DROP below the
    // eye line, so it sits at chest height like a real muzzle.
    function project(p) {
      var d = Math.max(4, p.d);
      var ang = (p.o || 0) * halfFov;
      return {
        x: W / 2 + PROJ * Math.tan(ang),
        y: horizon + projH(SHOT_EYE_DROP, d),
        d: d,
        perp: d * Math.cos(ang)      // for the wall z-test, like the sprites
      };
    }
    // A sample is hidden when a nearer wall covers its column.
    function occluded(pt) {
      var ci = Math.floor(pt.x / colW);
      if (ci < 0 || ci >= n) return true;
      return zbuf[ci] <= pt.perp - 2;
    }

    for (var s = 0; s < shots.length; s++) {
      var sh = shots[s];
      var pts = sh.pts || [];
      if (pts.length < 2) continue;
      var paint = teamCol(sh.team) || AMBER;
      // Age fade, with misses pre-aged so hits read brighter.
      var age = (sh.age || 0) + (sh.hit ? 0 : SHOT_MISS_AGE);
      var life = Math.max(0, 1 - age / SHOT_FX_TICKS);
      if (life <= 0.02) continue;

      // Project every visible sample; nulls (fog) and wall-occluded samples
      // break the polyline into separate runs so the trail never draws through
      // something it shouldn't.
      var runs = [], run = null;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        var ok = false, pr = null;
        if (p) {
          pr = project(p);
          ok = !occluded(pr);
        }
        if (ok) {
          pr.t = pts.length > 1 ? i / (pts.length - 1) : 1;   // 0 muzzle → 1 impact
          if (!run) { run = []; runs.push(run); }
          run.push(pr);
        } else {
          run = null;
        }
      }
      if (!runs.length) continue;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // INCOMING shots are a special visual case. A beam fired toward the camera
      // projects almost to a POINT (every sample shares a bearing), so the
      // generic trail degenerates into a vertical smear — geometrically right,
      // but it reads as a blob, not as paint coming at your face. Detect it from
      // the projected spread vs the depth it covers, and draw it as a paintball
      // rushing the lens instead: one hot ball with a tight halo, scaled by how
      // close the nearest sample is.
      var flatSpan = 0, dSpan = 0;
      var allPts = [];
      for (var q = 0; q < runs.length; q++) allPts = allPts.concat(runs[q]);
      if (allPts.length) {
        var xs = allPts.map(function (p) { return p.x; });
        var ds = allPts.map(function (p) { return p.d; });
        flatSpan = Math.max.apply(null, xs) - Math.min.apply(null, xs);
        dSpan = Math.max.apply(null, ds) - Math.min.apply(null, ds);
      }
      // Lots of depth travelled but almost no screen movement = head-on.
      var incoming = dSpan > 60 && flatSpan < W * 0.10;
      if (incoming) {
        var nearest = allPts[0];
        for (var w2 = 1; w2 < allPts.length; w2++) {
          if (allPts[w2].d < nearest.d) nearest = allPts[w2];
        }
        // Cap the ball: a beam that ENDS at the camera has d≈4, and projH blows
        // up as d→0, so an uncapped radius swallows the whole inset. A paintball
        // about to hit your visor should read as a fat ball, not a red curtain —
        // the visor paint-splat is what sells the actual impact.
        var br = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1.5, projH(SHOT_HEAD_WORLD * 1.35, nearest.d) * 0.5));
        var bDim = Math.max(0.45, 1 - nearest.d / FPV_FOG);
        var bg = ctx.createRadialGradient(nearest.x, nearest.y, 0,
                                          nearest.x, nearest.y, br * 3.0);
        bg.addColorStop(0, withAlpha(paint, 0.62 * life * bDim));
        bg.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(nearest.x, nearest.y, br * 3.0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = withAlpha(paint, Math.min(1, 0.95 * life * bDim + 0.1));
        ctx.beginPath(); ctx.arc(nearest.x, nearest.y, br, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,248,236,' + (0.72 * life * bDim).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(nearest.x - br * 0.28, nearest.y - br * 0.28, br * 0.34,
                0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        continue;
      }

      // Fog often clips a beam to a SHORT visible run (the shooter is in another
      // room, we only glimpse the paint crossing a doorway). Lift the along-beam
      // fade for those so a 1-3 sample glimpse still reads as paint in flight
      // instead of an invisible sliver: `lift` rescales t across what we can
      // actually see. A fully visible beam (t spanning ~0..1) is unaffected.
      var tSeen = 0;
      for (var r0 = 0; r0 < runs.length; r0++) {
        var sg = runs[r0];
        tSeen = Math.max(tSeen, sg[sg.length - 1].t - sg[0].t);
      }
      var lift = tSeen < 0.35 ? 0.55 : 0;   // floor on the along-beam brightness

      // --- trail: segment-by-segment, so width AND alpha track depth ---
      for (var r = 0; r < runs.length; r++) {
        var seg = runs[r];
        // A run of ONE visible sample has no segment to stroke, so give it a
        // short stub along the beam's local direction — otherwise a glimpsed
        // shot renders as nothing at all.
        if (seg.length === 1) {
          var only = seg[0];
          var stub = Math.min(H * SHOT_MAX_TRAIL_H * 3,
                              Math.max(1.5, projH(SHOT_TRAIL_WORLD * 2.2, only.d)));
          var sDim = Math.max(0.35, 1 - only.d / FPV_FOG);
          ctx.strokeStyle = withAlpha(paint, 0.8 * life * sDim);
          ctx.lineWidth = Math.min(H * SHOT_MAX_TRAIL_H,
                                   Math.max(0.8, projH(SHOT_TRAIL_WORLD, only.d) * 0.9));
          ctx.beginPath();
          ctx.moveTo(only.x - stub / 2, only.y);
          ctx.lineTo(only.x + stub / 2, only.y);
          ctx.stroke();
          continue;
        }
        for (var k = 0; k + 1 < seg.length; k++) {
          var a = seg[k], b = seg[k + 1];
          // Along-beam brightness: faint at the muzzle, bright behind the head.
          var t = (a.t + b.t) / 2;
          var beam = lift + (1 - lift) * Math.pow(t, SHOT_TRAIL_FALLOFF);
          // Depth: nearer trail is thicker, and distance dims it like the walls.
          var wide = projH(SHOT_TRAIL_WORLD, Math.min(a.d, b.d));
          var depthDim = Math.max(0.35, 1 - Math.min(a.d, b.d) / FPV_FOG);
          var alpha = 0.9 * life * beam * depthDim;
          if (alpha < 0.04) continue;
          ctx.strokeStyle = withAlpha(paint, alpha);
          ctx.lineWidth = Math.min(H * SHOT_MAX_TRAIL_H,
                                   Math.max(0.6, wide * (0.45 + 0.55 * t)));
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      // --- leading paintball head at the impact end ---
      var last = runs[runs.length - 1];
      var head = last[last.length - 1];
      // Only crown the head when the beam's impact end is genuinely the one we
      // can see (a beam clipped by fog shouldn't sprout a head mid-air).
      var headIsImpact = head.t > 0.92;
      if (headIsImpact) {
        // Capped like the incoming ball: projH diverges as depth → 0, and a
        // point-blank impact must not paint over the whole inset.
        var hr = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1.2, projH(SHOT_HEAD_WORLD, head.d) * 0.5));
        var hDim = Math.max(0.4, 1 - head.d / FPV_FOG);
        // wet glow, then the solid ball, then a bright wet highlight
        var g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr * 2.6);
        g.addColorStop(0, withAlpha(paint, 0.55 * life * hDim));
        g.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(head.x, head.y, hr * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = withAlpha(paint, Math.min(1, 0.95 * life * hDim + 0.1));
        ctx.beginPath(); ctx.arc(head.x, head.y, hr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,248,236,' + (0.7 * life * hDim).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(head.x - hr * 0.3, head.y - hr * 0.3, hr * 0.36, 0, Math.PI * 2);
        ctx.fill();

        // Impact burst: a few short paint flecks kicking off the surface, only
        // while the shot is fresh — it marks WHERE the paint landed.
        if (sh.hit && life > 0.55) {
          ctx.strokeStyle = withAlpha(paint, 0.75 * life);
          ctx.lineWidth = Math.max(0.6, hr * 0.28);
          for (var f = 0; f < 5; f++) {
            var fa = (f / 5) * Math.PI * 2 + head.d;   // deterministic off depth
            var fl = hr * (1.5 + 0.9 * ((f % 3) / 2));
            ctx.beginPath();
            ctx.moveTo(head.x + Math.cos(fa) * hr * 0.9,
                       head.y + Math.sin(fa) * hr * 0.9);
            ctx.lineTo(head.x + Math.cos(fa) * fl, head.y + Math.sin(fa) * fl);
            ctx.stroke();
          }
        }
      }

      // --- muzzle flash at the shooter's end, brightest on the freshest shot ---
      var first = runs[0][0];
      if (first.t < 0.12 && life > 0.5) {
        var mr = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1, projH(SHOT_HEAD_WORLD * 1.5, first.d) * 0.5));
        var mg = ctx.createRadialGradient(first.x, first.y, 0,
                                          first.x, first.y, mr * 2.2);
        var flash = (life - 0.5) / 0.5;          // only the first ticks flash
        mg.addColorStop(0, 'rgba(255,242,214,' + (0.7 * flash).toFixed(3) + ')');
        mg.addColorStop(0.45, withAlpha(paint, 0.42 * flash));
        mg.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(first.x, first.y, mr * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // A cog seen head-on in first person: a chunky team-tinted chassis with a dark
  // visor band carrying TWO glowing cyan eyes (the cog's signature), a pair of
  // side wheels, and a bottom shadow. Enemies get red hp pips; carriers an amber
  // heart above; mates a paper outline ring. `dim` (0..1) applies depth shading.
  function drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim) {
    dim = dim == null ? 1 : dim;
    var baseCol = teamCol(e.team) || AMBER;
    var col = shade(baseCol, dim);
    if (e.k === 'item') {
      // Items rest on the floor: center the glyph a little above the contact point.
      var ir = figH * 0.7;
      drawItemGlyph(ctx, e.item, cx, feetY - ir * 0.5, ir, dim);
      return;
    }
    if (e.k === 'heart') {
      // A heart pedestal sits on the floor; lift the glyph so it rests, not floats.
      var hs = figH * 0.9;
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.fillStyle = col;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.05);
      heartPath(ctx, cx, feetY - hs * 0.5, hs);
      ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    var enemy = e.k === 'enemy';
    var feet = feetY;
    var top = feet - figH;
    // Size the blit off the projected figure so distant cogs shrink like the
    // walls. The front master's aspect is ~0.94 w/h; its HEIGHT tracks figH so
    // the cog stands the right size on the floor.
    // Live cogs carry their paintball marker, so they get the armed pose; both
    // poses share the same aspect and trim, so the geometry is unchanged.
    var artImg = cogArtFor(e.team, true);
    var drawH = figH * 1.02;
    var drawW = drawH * COG_ASPECT;
    var bodyW = drawW;         // for the mate ring + shadow width
    ctx.save();
    ctx.lineJoin = 'round';

    // contact shadow ON the floor, right under the wheels — grounds the figure.
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(cx, feet, bodyW * 0.5, figH * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();

    if (cogArtReady(artImg)) {
      // Blit the cog box (COG_TRIM as fractions of natural size — full-frame for
      // the pre-trimmed front master, a cut-out box for the top-down fallback),
      // centered on cx and standing with its feet on `feet`.
      var iw = artImg.naturalWidth, ih = artImg.naturalHeight;
      var sxp = COG_TRIM.x * iw, syp = COG_TRIM.y * ih;
      var swp = COG_TRIM.w * iw, shp = COG_TRIM.h * ih;
      var dx = cx - drawW / 2, dy = feet - drawH;
      if (dim >= 0.995) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(artImg, sxp, syp, swp, shp, dx, dy, drawW, drawH);
      } else {
        // Depth-dim via an offscreen scratch so only sprite pixels darken.
        var sw = Math.max(1, Math.ceil(drawW)), sh = Math.max(1, Math.ceil(drawH));
        if (cogScratch.width !== sw) cogScratch.width = sw;
        if (cogScratch.height !== sh) cogScratch.height = sh;
        if (!cogScratchCtx) cogScratchCtx = cogScratch.getContext('2d');
        var sc = cogScratchCtx;
        sc.clearRect(0, 0, sw, sh);
        sc.imageSmoothingEnabled = false;
        sc.globalCompositeOperation = 'source-over';
        sc.drawImage(artImg, sxp, syp, swp, shp, 0, 0, sw, sh);
        // ink wash clipped to the sprite silhouette (source-atop)
        sc.globalCompositeOperation = 'source-atop';
        sc.fillStyle = 'rgba(10,7,4,' + (1 - dim).toFixed(3) + ')';
        sc.fillRect(0, 0, sw, sh);
        sc.globalCompositeOperation = 'source-over';
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cogScratch, dx, dy, drawW, drawH);
      }
    } else {
      // Fallback: procedural chassis until the art loads.
      drawFpvChassis(ctx, cx, feet, figW, figH, col, dim);
    }

    // mate ring: a paper hoop under the chassis so allies read at a glance
    if (e.k === 'mate') {
      ctx.strokeStyle = 'rgba(242,232,216,' + (0.75 * dim).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, figH * 0.04);
      ctx.beginPath();
      ctx.ellipse(cx, feet - figH * 0.02, bodyW * 0.62, figH * 0.09, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // enemy hp pips over the head
    if (enemy && typeof e.hp === 'number' && e.hp >= 0) {
      var pips = Math.min(6, e.hp);
      var pr = Math.max(1, figH * 0.045);
      var pyy = top - pr * 1.6;
      for (var p = 0; p < pips; p++) {
        ctx.fillStyle = RED;
        ctx.beginPath();
        ctx.arc(cx - (pips - 1) * pr * 1.5 / 2 + p * pr * 1.5, pyy, pr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // carrier heart above the head
    if (e.carry) {
      ctx.fillStyle = AMBER;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.03);
      var chs = figH * 0.2;
      heartPath(ctx, cx, top - chs * (enemy ? 1.6 : 0.7), chs);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Procedural cog chassis — the fallback billboard drawn only until the real
  // front-facing art (COG_ART) has loaded. Chunky team-tinted body, side wheels,
  // dark visor band with two glowing cyan eyes. (cx, feet) is the sprite's
  // ground contact; figW/figH the projected size; col the depth-shaded team tint.
  function drawFpvChassis(ctx, cx, feet, figW, figH, col, dim) {
    var bodyW = figW * 0.78;
    var bodyH = figH * 0.72;
    var bodyTop = feet - bodyH;
    var lw = Math.max(1, figH * 0.05);

    // side wheels (dark, behind the chassis edges)
    ctx.fillStyle = shade('#2a211a', dim);
    ctx.strokeStyle = 'rgba(10,7,4,0.9)'; ctx.lineWidth = lw;
    var wheelW = bodyW * 0.2, wheelH = bodyH * 0.62;
    roundRect(ctx, cx - bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, cx + bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();

    // chassis body (rounded, team-tinted) with a top highlight + bottom shade band
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(10,7,4,0.92)'; ctx.lineWidth = lw;
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH, bodyW * 0.22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,210,' + (0.14 * dim).toFixed(3) + ')';
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH * 0.34, bodyW * 0.22);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(ctx, cx - bodyW / 2, bodyTop + bodyH * 0.62, bodyW, bodyH * 0.38, bodyW * 0.22);
    ctx.fill();

    // dark visor band across the upper chassis with two glowing cyan eyes
    var visorY = bodyTop + bodyH * 0.26;
    var visorH = bodyH * 0.3;
    ctx.fillStyle = shade('#141b1e', dim);
    roundRect(ctx, cx - bodyW * 0.4, visorY, bodyW * 0.8, visorH, visorH * 0.45);
    ctx.fill();
    var eyeR = Math.max(1, visorH * 0.32);
    var eyeDx = bodyW * 0.18, eyeCy = visorY + visorH * 0.5;
    var eyeCol = 'rgba(120,236,246,' + (0.65 + 0.35 * dim).toFixed(3) + ')';
    for (var s = -1; s <= 1; s += 2) {
      var g = ctx.createRadialGradient(cx + s * eyeDx, eyeCy, 0, cx + s * eyeDx, eyeCy, eyeR * 2.4);
      g.addColorStop(0, eyeCol); g.addColorStop(1, 'rgba(120,236,246,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d6fbff';
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR, 0, Math.PI * 2); ctx.fill();
    }
  }

  // rounded-rect helper (older canvases lack ctx.roundRect)
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // Tint a #rrggbb by a factor (>1 lighten, <1 darken).
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    function c(i) { return Math.max(0, Math.min(255, Math.round(parseInt(m[i], 16) * f))); }
    return 'rgb(' + c(1) + ',' + c(2) + ',' + c(3) + ')';
  }

  // Same hex, given alpha — for the paint tracers, which fade by age and depth.
  function withAlpha(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    var al = Math.max(0, Math.min(1, a)).toFixed(3);
    if (!m) return hex;
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' +
      parseInt(m[3], 16) + ',' + al + ')';
  }

  // MINECRAFT: the starter's first-person self-status HUD (#fpv-hp, #fpv-gear)
  // and its un-fogged tactical map (#fpv-map) are REMOVED with their markup -
  // there is no health bar in this game at all, and an un-fogged tactical map
  // is exactly what the kept #minimap already is. The #fpv panel itself is
  // kept and repurposed as the cog's own egocentric window, drawn by the
  // appended game block.

  function renderMismatch(s) {
    $('mmwarn').classList.toggle('on', s.mm >= 0);
  }

  // ============================================================
  //  Beats → surfaces  (§5)
  // ============================================================
  function applyEvent(e, s) {
    // PAINTBALL: every beat goes through the appended game block, which draws
    // LABELLED, CLICKABLE buttons on the scrubber (pbBeat) instead of
    // chrome_common's unlabelled div markers. When the block handles a kind
    // it returns true, so the classic switch never doubles it; classic
    // replays never enter this branch at all.
    if (MC_MODE && window.MinecraftChrome &&
        window.MinecraftChrome.event(e, s, MC_CTX)) {
      beatPulse();
      return;
    }
    switch (e.k) {
      case 'kill': onKill(e, s); markBeat(e.t, 'kill', killMarkerTeam(e, s)); beatPulse(); break;
      case 'steal': onSteal(e, s); markBeat(e.t, 'steal', e.flag); beatPulse(); break;
      case 'return': onReturn(e, s); markBeat(e.t, 'return', e.flag); beatPulse(); break;
      case 'capture': recordCapHeart(e); onCapture(e, s); markBeat(e.t, 'capture', captureTeam(s, e)); beatPulse(); break;
      case 'respawn': /* board rematerialize handles this visually */ break;
      case 'gameover': /* end-card is state-driven */ break;
      case 'phase': /* clock caption handles phase */ break;
    }
  }

  // Slots already drawn as the partner of a provable same-tick trade, so the
  // second half of the pair is suppressed (one linked row, not two). Keyed by
  // "tick:victimSlot"; a tiny ring is plenty since only same-tick pairs matter.
  var tradeConsumed = {};
  function onKill(e, s) {
    var killer = e.killer, victim = e.victim;
    var victimTeam = teamOf(s, victim);
    var killerTeam = killer >= 0 ? teamOf(s, killer) : null;
    var glyph = '▸';
    var badge = '';
    if (e.trade !== undefined && e.trade >= 0) {
      // Provable mutual trade: the server proved these two killed each other
      // this tick (the two killers ARE the two victims). Draw ONE linked row
      // with both names; skip the partner's own event so it isn't doubled.
      if (tradeConsumed[e.t + ':' + victim]) { delete tradeConsumed[e.t + ':' + victim]; return; }
      tradeConsumed[e.t + ':' + e.trade] = true;
      var row = document.createElement('div');
      row.className = 'feed-row';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' +
        '<span class="glyph">⇄</span>' +
        '<span class="who ' + (teamOf(s, e.trade) || '') + '">' + esc(shortName(rosterName(s, e.trade))) + '</span>' +
        '<span class="badge">traded</span>';
      pushFeed(row);
      return;
    }
    var row = document.createElement('div');
    row.className = 'feed-row';
    if (e.amb) {
      // Same-tick multi-kill the sim can't pair (a 3-way pileup or two
      // independent kills). Attribution is honestly unknown (F7): show the
      // victim with a neutral marker, never a fabricated killer or "traded".
      badge = '<span class="badge">double KO</span>';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    } else {
      if (e.tk) { badge = '<span class="badge tk">team kill</span>'; row.classList.add('flagkill'); }
      var killerName = killer >= 0 ? shortName(rosterName(s, killer)) : 'the arena';
      row.innerHTML = '<span class="who ' + (killerTeam || '') + '">' + esc(killerName) + '</span>' +
        '<span class="glyph">' + glyph + '</span>' +
        '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    }
    pushFeed(row);
  }

  function onSteal(e, s) {
    var heartTeam = e.flag; // the team whose heart was TAKEN (e.flag is the legacy event field)
    banner(String(heartTeam).toUpperCase() + ' HEART TAKEN', 'steal accent ' + heartTeam);
  }
  function onReturn(e, s) {
    var heartTeam = e.flag;
    banner(String(heartTeam).toUpperCase() + ' HEART RETURNED', 'returned accent ' + heartTeam);
  }
  function onCapture(e, s) {
    var byTeam = captureTeam(s, e);
    banner(String(byTeam).toUpperCase() + ' CAPTURES', 'wipe accent ' + byTeam);
  }

  // (teamOf / esc live in the shared chrome — chrome_common.js. The shared esc
  // also escapes the double-quote, which this page's old copy dropped.)

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // (scrubber beat markers — markBeat / killMarkerTeam / renderBeatMarkers —
  // live in the shared chrome — chrome_common.js)

  // (momentum graph — recordMomentum / renderMomentum and their state —
  // lives in the shared chrome — chrome_common.js)

  // ============================================================
  //  End-card (§5/§8) — the END SEGMENT: verdict, win condition and match
  //  stats, held on screen by the server for ~10s before a looping restart.
  //  Reads isDraw BEFORE winner (F4); names the key (F3).
  // ============================================================
  function overLives(o, team) {
    // A team's final lives from the verdict frame: the team-keyed map when
    // present, else the legacy red/blue scalars.
    if (o.teams && o.teams[team]) return o.teams[team].lives || 0;
    return team === 'red' ? (o.redLives || 0) : team === 'blue' ? (o.blueLives || 0) : 0;
  }

  function endcardWinCondition(o, teams) {
    // The condition CHIP: how the match ended, in two or three words.
    // (A time-limit ending is always a draw in the current rules — the sim's
    // checkMaxTicks path never crowns a winner — so timeLimit only pairs
    // with draw here.)
    if (o.endRule !== undefined) {
      // PAINTBALL names the RULE the server actually applied, so the chip can
      // never disagree with the endRule in results.json.
      switch (o.endRule) {
        case 'wipe': return o.draw ? 'MUTUAL WIPE' : 'WIPE';
        case 'mercy': return 'MERCY — LEAD BEYOND THE CLOCK';
        case 'wall_clock': return 'WALL-CLOCK STOP';
        case 'sim_fault':
        case 'host_error': return 'FAULT — NO RESULT';
        default: return o.draw ? 'FULL TIME — DEAD EVEN' : 'FULL TIME ON THE HILL';
      }
    }
    if (o.draw) return o.timeLimit ? 'TIME LIMIT — DRAW' : 'DRAW';
    var losers = teams.filter(function (t) { return t !== o.winner; });
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });
    return bestLoser <= 0 ? 'ELIMINATION' : 'HEART CAPTURE';
  }

  function endcardOrder(a, b) {
    // Kills lead the board; fewer deaths, then captures, break ties.
    return (b.k || 0) - (a.k || 0) || (a.d || 0) - (b.d || 0) ||
      (b.cap || 0) - (a.cap || 0) || a.s - b.s;
  }

  function endcardBadge(cls, count, title) {
    // One honor icon; repeat events fold into a ·N suffix instead of stacking.
    if (!count) return '';
    return '<span class="ec-badge ' + cls + '" title="' + title + '">' +
      (count > 1 ? '·' + count : '') + '</span>';
  }

  // Which hearts each seat captured, keyed by join slot: fed by the up-front
  // beat timeline (replays ship every capture on the first HUD frame) and by
  // live capture events, deduped by tick|slot so the two paths never
  // double-count one capture (a loop restart re-fires both, harmlessly).
  var capHeartsBySlot = {};
  var capHeartsSeen = {};
  function recordCapHeart(e) {
    if (e.by == null || e.by < 0 || !e.flag) return;
    var key = e.t + '|' + e.by;
    if (capHeartsSeen[key]) return;
    capHeartsSeen[key] = true;
    (capHeartsBySlot[e.by] = capHeartsBySlot[e.by] || []).push(e.flag);
  }
  function ingestCapHearts(s) {
    if (!s.beats) return;
    for (var i = 0; i < s.beats.length; i++) {
      if (s.beats[i].k === 'capture') recordCapHeart(s.beats[i]);
    }
  }

  function capturedHeartHtml(heartTeam) {
    // One captured heart, drawn as the captured team's own heart art (its
    // baked pixel art); a team without baked art gets a tinted glyph.
    if (heartTeam === 'red' || heartTeam === 'blue' ||
        heartTeam === 'green' || heartTeam === 'yellow') {
      return '<span class="ec-heart ' + heartTeam + '" title="Captured the ' + heartTeam + ' heart"></span>';
    }
    return '<span class="ec-heart-glyph" title="Captured an enemy heart">♥</span>';
  }

  function capturedHeartsHtml(s, p) {
    // The Cap column renders EVERY captured heart, one per capture — a 4-team
    // match (GV32: a capture eliminates its team and play continues) can see
    // one seat retire two or three rival hearts. The beat timeline names each
    // heart; when it can't (older servers ship no beats), fall back to the
    // roster's capture count, colored as the enemy heart only when two teams
    // make that unambiguous.
    var caps = p.cap || 0;
    if (caps <= 0) return '';
    var flags = capHeartsBySlot[p.s] || [];
    if (flags.length < caps) {
      var teams = activeTeams(s);
      var enemy = teams.length === 2 ? (teams[0] === p.team ? teams[1] : teams[0]) : null;
      flags = [];
      for (var i = 0; i < caps; i++) flags.push(enemy);
    }
    return flags.map(capturedHeartHtml).join('');
  }

  function renderEndcardRows(s, team, el, mvpSlot) {
    // Final per-player stat lines, top killer first. The MVP (winning team's
    // best line) reads in amber — no star prefix, it would break the name
    // column's alignment. Clstr counts grenade/spray multi-kill events; the
    // Cap column renders each captured heart itself, one per capture, in the
    // captured team's color; a dagger icon marks
    // teammate kills. A mixed team (2+ policies) groups its rows under policy
    // subheaders so each policy's contribution reads separately.
    var rows = (s.roster || []).filter(function (p) { return p.team === team; })
      .slice().sort(endcardOrder);
    var pols = teamPolicies(s, team);
    var grouped = pols.length > 1 && pols.length <= 4;
    var html = '';
    function rowHtml(p) {
      var mvp = mvpSlot != null && p.s === mvpSlot;
      if (MC_MODE) {
        // PAINTBALL: the row is a COG (its anonymous alias), and the columns
        // are tags dealt, tags taken and what its squad painted. Kills and
        // captures are not the score here and never appear as one.
        var pbMarks = endcardBadge('bs', p.tk, 'Friendly fire — tagged a teammate');
        var tr = (s.teams || {})[p.team] || {};
        return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
          '<span class="pcell">' +
          '<span class="pname">' + esc(p.alias || shortName(rosterName(s, p.s))) + '</span>' +
          pbMarks +
          '</span>' +
          '<span class="n">' + (p.k || 0) + '</span>' +
          '<span class="n">' + (p.d || 0) + '</span>' +
          '<span class="n clstr">' + (tr.paint || 0) + '</span>' +
          '</div>';
      }
      var marks = endcardBadge('bs', p.tk, 'Backstab — killed a teammate');
      var cluster = (p.mk2 || 0) + (p.mk3 || 0);
      return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
        '<span class="pcell">' +
        '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
        marks +
        '</span>' +
        '<span class="n">' + (p.k || 0) + '</span>' +
        '<span class="n">' + (p.d || 0) + '</span>' +
        '<span class="n clstr">' + (cluster > 0 ? cluster : '') + '</span>' +
        '<span class="n cap">' + capturedHeartsHtml(s, p) + '</span>' +
        '</div>';
    }
    if (grouped) {
      pols.forEach(function (pol) {
        html += '<div class="ec-pol">' + esc(teamHeadline(pol)) + '</div>';
        rows.forEach(function (p) {
          var pp = p.pol != null ? p.pol : stripSeatSuffix(p.name);
          if (pp === pol) html += rowHtml(p);
        });
      });
    } else {
      rows.forEach(function (p) { html += rowHtml(p); });
    }
    el.innerHTML = html;
  }

  // Rebuild the endcard's per-team stat panels when the active team set
  // changes (once per match in practice): one panel per team, in display order.
  var ecTeams = null;
  function ensureEndcardTeams(teams) {
    var key = teams.join(',') + (MC_MODE ? '|pb' : '');
    if (ecTeams === key) return;
    ecTeams = key;
    var wrap = $('ec-teams');
    wrap.innerHTML = '';
    teams.forEach(function (team) {
      var el = document.createElement('div');
      el.className = 'ec-team';
      el.id = 'ec-team-' + team;
      el.innerHTML = MC_MODE
        ? '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0:00</span>' +
          '<span class="fl-cap">Hill time</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Cog</span><span>Tags</span><span>Out</span><span>Paint</span></div>' +
          '<div id="ec-rows-' + team + '"></div>'
        : '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0</span>' +
          '<span class="fl-cap">Lives left</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Player</span><span>K</span><span>D</span><span>Clstr</span><span>Cap</span></div>' +
          '<div id="ec-rows-' + team + '"></div>';
      wrap.appendChild(el);
    });
  }

  function renderEndcard(s) {
    var card = $('endcard');
    if (!s.over) return;
    card.classList.add('on'); // own the frame at GameOver (§8) — before either verdict branch
    var o = s.over;
    var teams = activeTeams(s);
    ensureEndcardTeams(teams);

    // The loop countdown ticks every second while everything else is frozen,
    // so it renders unconditionally; the static content is keyed and only
    // rebuilt when the verdict frame actually changes (24fps hold, no churn).
    $('ec-replay').innerHTML = s.lp && s.hold > 0
      ? 'Replaying in <b>' + s.hold + '</b>' : '';

    var key = [s.mx, o.winner, o.draw, o.timeLimit, (s.roster || []).length].join('|');
    if (card._key === key) return;
    card._key = key;

    var head = $('ec-headline'), how = $('ec-how');
    $('ec-wincond').textContent = endcardWinCondition(o, teams);

    // MVP: the winning team's best final line (kills > fewer deaths >
    // captures — the capturer keeps their ⚑ mark, the star follows the guns).
    // A draw crowns nobody — the fidelity rules never invent a distinction the
    // sim didn't make (F4).
    var mvpSlot = null;
    if (!o.draw) {
      var winners = (s.roster || []).filter(function (p) { return p.team === o.winner; })
        .sort(endcardOrder);
      if (winners.length) mvpSlot = winners[0].s;
    }
    teams.forEach(function (team) {
      $('ec-' + team).textContent = MC_MODE
        ? fmt(team === 'red' ? (o.hillRed || 0) : (o.hillBlue || 0))
        : overLives(o, team);
      $('ec-tname-' + team).textContent = teamName(s, team, team.toUpperCase());
      $('ec-team-' + team).classList.toggle('win', !o.draw && o.winner === team);
      renderEndcardRows(s, team, $('ec-rows-' + team), mvpSlot);
    });

    if (MC_MODE) {
      // PAINTBALL: the verdict names the rule the server applied and always
      // states both banked hill clocks.
      var hillLine = 'RED holds ' + fmt(o.hillRed || 0) + ' — BLUE ' +
        fmt(o.hillBlue || 0) + ' · game ' + (o.game || 1) + '/' + (o.games || 1) +
        ' · ' + String(o.regime || '').toUpperCase();
      if (o.draw) {
        head.className = 'headline draw';
        head.textContent = 'DEAD EVEN';
        how.textContent = hillLine +
          ' — both squads banked the same hill time, so this half scores 0.500 each.';
        return;
      }
      var pbWinner = o.winner;
      var pbWinName = teamName(s, pbWinner, String(pbWinner).toUpperCase());
      head.className = 'headline ' + pbWinner;
      head.textContent = pbWinName + ' WINS';
      switch (o.endRule) {
        case 'wipe':
          head.textContent = pbWinName + ' WIPES THE FIELD';
          how.textContent = hillLine +
            ' — the other squad ran out of cogs, so the survivor was credited' +
            ' every remaining tick.';
          break;
        case 'mercy':
          how.textContent = hillLine +
            ' — the lead was bigger than the clock left, so the rules ended it.';
          break;
        case 'wall_clock':
          how.textContent = hillLine +
            ' — the engine hit its wall-clock budget and scored the half from' +
            ' the hill counts at that tick.';
          break;
        default:
          how.textContent = hillLine + ' — full time on the hill clock.';
      }
      return;
    }

    if (o.draw) {
      head.className = 'headline draw';
      head.textContent = 'DRAW — NO SCORE';
      how.textContent = o.timeLimit
        ? 'Time expired before a capture or a wipe — a scoreless draw, with no tiebreak on lives.'
        : 'The match ended with neither side scoring — no winner.';
      return;
    }

    var winner = o.winner;
    var winName = teamName(s, winner, String(winner).toUpperCase());
    head.className = 'headline ' + winner;
    head.textContent = winName + ' WINS';

    var losers = teams.filter(function (t) { return t !== winner; });
    var winL = overLives(o, winner);
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });

    if (o.timeLimit) {
      // Time-limit resolution — name the key and the values (F3).
      if (winL !== bestLoser) {
        how.textContent = 'Time expired — ' + winName + ' held more lives (' + winL + ' vs ' + bestLoser + ').';
      } else {
        how.textContent = 'Time expired — lives tied; ' + winName + ' won on heart progress.';
      }
    } else {
      if (bestLoser <= 0) {
        head.textContent = losers.length === 1
          ? winName + ' WIPES OUT ' +
            teamName(s, losers[0], String(losers[0]).toUpperCase())
          : winName + ' WIPES THE FIELD';
        how.textContent = winName + ' eliminated every opposing life.';
      } else {
        how.textContent = winName + ' captured the enemy heart.';
      }
    }
  }

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed→command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  // Map an x-fraction of the scrubber onto the shown [startTick, maxTick] axis
  // and seek there. One place, shared by a live click and by a click that had
  // to wait for the first frame.
  function seekToFraction(s, frac) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    send('s:' + (st + Math.round(frac * (mx - st))));
  }

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // The axis lives on the frame, so a click before the first frame cannot be
    // mapped yet — QUEUE it (onFrame flushes SEEK_FRAC) rather than dropping
    // it. A dropped first click is invisible: the board is already drawn, the
    // transport looks alive, and the viewer just does not move.
    if (!lastState || !lastState.en) { SEEK_FRAC = frac; return; }
    seekToFraction(lastState, frac);
  });

  // MINECRAFT: #povBadge is REMOVED (one seat, nothing to select), so its
  // click binding goes with it.

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k === 'o') setSpoilers(!getSpoilers());
    // Board zoom rides z/x/0: +/- and 1..9 are already the server's speed
    // commands, so they can't double as view keys.
    else if (k === 'z') core.zoomAt(ZOOM_STEP);
    else if (k === 'x') core.zoomAt(1 / ZOOM_STEP);
    else if (k === '0') core.resetView();
    // Arrows walk the view one CELL at a time; with shift, ten cells. A cell is
