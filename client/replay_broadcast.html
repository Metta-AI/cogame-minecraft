    // a fixed distance in the WORLD — the same ground on every map and at every
    // zoom — so arrowing is a way of stepping across the arena, not a nudge
    // whose size depends on how far in you happen to be.
    else if (k === 'ArrowLeft' || k === 'ArrowRight' ||
             k === 'ArrowUp' || k === 'ArrowDown') {
      var vt = core.getTransform();
      if (!vt || !(vt.zoom > 1)) return;   // fitted whole: nowhere to go
      ev.preventDefault();
      var step = panCellBoardPx() * (ev.shiftKey ? 10 : 1);
      var stepX = (k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0);
      var stepY = (k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0);
      core.panByMap(stepX * step, stepY * step);
    }
    else if (k >= '1' && k <= '9') send(k);
    // keydown never crosses the iframe boundary: relay Esc to the league
    // shell, which relays it on to the Observatory theater host.
    else if (k === 'Escape') postToShell('esc');
  });

  // Click a soldier on the board to select it (mirrors the squad-pip lens, but
  // for anyone visible on the arena). The board canvas draws ONLY the zoomable
  // map layer, letterboxed by broadcast_core; chrome (scoreboard, transport) are
  // HTML overlays, so a canvas click is always a MAP-space click. Invert the
  // core's letterbox transform to recover native map pixels, then hand them to
  // clickMap — the server hit-tests the soldier footprint and toggles selection.
  // ---- zoom + pan -------------------------------------------------------
  // A generated board can be 4992px square; letterboxed whole into a ~760px
  // stage that is 0.15x, where a cog is a single pixel. So the board has to be
  // enterable — but NOT by scrolling. A trackpad two-finger scroll and a mouse
  // wheel are how you move the PAGE, and a viewer that eats them zooms the
  // board every time someone tries to scroll past it. The gestures that mean
  // "zoom" and nothing else are: pinch (trackpad and touchscreen), the +/-
  // buttons and slider, and the z/x keys. Drag pans, arrows nudge, double-click
  // (or 0, or the slider at rest) refits.
  // The transform lives in broadcast_core, so click-to-select below inverts the
  // SAME numbers and keeps hitting what you actually clicked at any zoom.
  var dragging = false, dragMoved = 0, lastDragX = 0, lastDragY = 0;
  function canvasPoint(ev) {
    var rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, ok: rect.width > 0 };
  }

  // A trackpad PINCH reaches a browser as a wheel event with ctrlKey set (no
  // ctrl key is actually held) — that, and only that, is the wheel we take.
  // Everything else falls through to the page exactly as if the board were an
  // image. preventDefault on this one also suppresses the browser's own
  // ctrl+wheel page zoom, which would otherwise fight the board zoom.
  var gesturing = false, gestureZoom = 1, gestureAt = null;
  canvas.addEventListener('wheel', function (ev) {
    if (!ev.ctrlKey || gesturing) return;
    ev.preventDefault();
    var p = canvasPoint(ev);
    if (!p.ok) return;
    var unit = ev.deltaMode === 1 ? 16 : (ev.deltaMode === 2 ? 100 : 1);
    core.zoomAt(Math.exp(-ev.deltaY * unit * 0.012), p.x, p.y);
  }, { passive: false });

  // Safari reports the same trackpad pinch as gesture events instead, with an
  // absolute scale factor from the gesture's start; `gesturing` keeps the two
  // paths from both firing on browsers that send both.
  canvas.addEventListener('gesturestart', function (ev) {
    ev.preventDefault();
    gesturing = true;
    var t = core.getTransform();
    gestureZoom = (t && t.zoom) || 1;
    gestureAt = canvasPoint(ev);
  });
  canvas.addEventListener('gesturechange', function (ev) {
    ev.preventDefault();
    if (!gesturing || !(ev.scale > 0)) return;
    var a = gestureAt && gestureAt.ok ? gestureAt : null;
    core.setZoom(gestureZoom * ev.scale, a ? a.x : undefined, a ? a.y : undefined);
  });
  canvas.addEventListener('gestureend', function (ev) {
    ev.preventDefault();
    gesturing = false;
  });

  // Touchscreen pinch. #board's touch-action leaves one-finger panning to the
  // page while it is fitted (so the board never traps a scroll) and takes it
  // back once zoomed in, where a drag has somewhere to go; pinch-zoom is never
  // in that list, so a second finger always arrives here as a pointer.
  var pinch = new Map();          // pointerId -> {x, y}
  var pinchSpan = 0, pinchMidX = 0, pinchMidY = 0;
  function pinchGeometry() {
    var pts = Array.from(pinch.values());
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      span: Math.max(1, Math.hypot(dx, dy)),
      midX: (pts[0].x + pts[1].x) / 2,
      midY: (pts[0].y + pts[1].y) / 2
    };
  }
  function beginPinch() {
    var g = pinchGeometry();
    pinchSpan = g.span;
    pinchMidX = g.midX;
    pinchMidY = g.midY;
    dragging = false;             // two fingers is a pinch, not a drag
  }

  function syncTouchAction(t) {
    // Fitted: the page owns one-finger drags. Zoomed: the board does.
    canvas.style.touchAction = (t && t.zoom > 1) ? 'none' : 'pan-x pan-y';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'touch') {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) { beginPinch(); return; }
      if (pinch.size > 2) return;
    }
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = 0;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
  });
  window.addEventListener('pointermove', function (ev) {
    if (pinch.has(ev.pointerId)) {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) {
        var g = pinchGeometry();
        var rect = canvas.getBoundingClientRect();
        // Zoom by how much the fingers spread, then pan by how far the pair
        // travelled, so the board tracks the hand instead of only the spread.
        core.zoomAt(g.span / pinchSpan, g.midX - rect.left, g.midY - rect.top);
        core.panBy(g.midX - pinchMidX, g.midY - pinchMidY);
        pinchSpan = g.span;
        pinchMidX = g.midX;
        pinchMidY = g.midY;
        dragMoved = 999;          // a pinch must never also select a cog
        return;
      }
    }
    if (!dragging) return;
    var dx = ev.clientX - lastDragX, dy = ev.clientY - lastDragY;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    core.panBy(dx, dy);
    var t = core.getTransform();
    canvas.style.cursor = t && t.zoom > 1 ? 'grabbing' : '';
  });
  function endPointer(ev) {
    if (ev && pinch.has(ev.pointerId)) {
      pinch.delete(ev.pointerId);
      if (pinch.size === 2) beginPinch();
    }
    dragging = false;
    canvas.style.cursor = '';
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ---- view controls: zoom cluster + minimap ----------------------------
  var ZOOM_STEP = 1.35;     // one button press / one z or x key
  var SLIDER_TRAVEL = 1000;
  // One arrow press, in LOGICAL map pixels — a fixed cell of ground. 64px is
  // eight of the engine's fog-of-war cells (FovCellSize) and a bit over five
  // cog widths: ~19 cells across the 1235px arena, ~39 across a 2496px 4-team
  // board, so shift (ten cells) crosses either in a couple of presses while a
  // single press is still a step you can aim with.
  var PAN_CELL_MAP_PX = 64;

  // and the two differ by the board's supersample factor — which is per-board
  // (an oversize map renders 1x, a normal one at RenderScale), so the server
  // states it per frame as `bs`. Falling back to 1 makes an un-stated board
  // step a cell of board pixels: smaller ground per press, never a broken key.
  function panCellBoardPx() {
    var bs = lastState && lastState.bs > 0 ? lastState.bs : 1;
    return PAN_CELL_MAP_PX * bs;
  }
  var minimapBox = $('minimap');
  var zoomSlider = $('zoom-slider');
  var zoomRead = $('zoom-read');
  var btnZoomIn = $('zoom-in');
  var btnZoomOut = $('zoom-out');
  var sliderHeld = false;
  var lastMiniAspect = '';

  function sliderToZoom(travel, t) {
    var lo = (t && t.minZoom) || 1, hi = (t && t.maxZoom) || 12;
    return lo * Math.pow(hi / lo, travel / SLIDER_TRAVEL);
  }
  function zoomToSlider(z, t) {
    var lo = (t && t.minZoom) || 1, hi = (t && t.maxZoom) || 12;
    if (!(z > lo)) return 0;
    return Math.round(SLIDER_TRAVEL * Math.log(z / lo) / Math.log(hi / lo));

  // One place where the whole view UI is re-read off the core's transform: the
  // slider, the readout, the button enable states, the minimap's shape and
  // whether it is up at all. Every input path (buttons, slider, keys, pinch,
  // drag, minimap, refit) lands here through onTransform, so no control can
  // drift out of step with the board.
  function syncViewUi(t) {

    zoomRead.classList.toggle('zoomed', zoomed);
    btnZoomIn.disabled = z >= hi - 1e-6;
    btnZoomOut.disabled = !zoomed;

    // only exists once part of the board is off-screen.
    minimapBox.classList.toggle('on', zoomed);
    if (t.nativeW > 0 && t.nativeH > 0) {
      var aspect = t.nativeW + ' / ' + t.nativeH;
      if (aspect !== lastMiniAspect) {

        minimapBox.style.aspectRatio = aspect;

    syncTouchAction(t);

  btnZoomOut.addEventListener('click', function () { core.zoomAt(1 / ZOOM_STEP); });

  window.addEventListener('pointerup', function () { sliderHeld = false; });
  zoomSlider.addEventListener('input', function () {

  // pan) — otherwise a focused slider and the board would both answer.

  // fastest way across it is to point at the destination, not to pan to it.
  var miniDragging = false;
  function minimapSeek(ev) {

    var t = core.getTransform();
    if (!rect.width || !rect.height || !t || !(t.nativeW > 0)) return;
    var fx = (ev.clientX - rect.left) / rect.width;
    var fy = (ev.clientY - rect.top) / rect.height;

  }
  minimapBox.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();

    // if the pointer is already gone, and that must not cost us the jump.

    } catch (err) { /* no active pointer: the click still seeks */ }

    if (miniDragging) minimapSeek(ev);
  });
  minimapBox.addEventListener('pointerup', function () { miniDragging = false; });
  minimapBox.addEventListener('pointercancel', function () { miniDragging = false; });

    ev.preventDefault();

  });

    // that happened to be under the pointer when the drag ended.
    if (dragMoved > 4) { dragMoved = 0; return; }

    if (!rect.width || !rect.height) return;

    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;

    core.clickMap(mapX, mapY);

  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {

    if (!boxW || !boxH) return;

    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));

      band = transport ? transport.offsetHeight : 0;

      root.style.setProperty('--band', band + 'px');

  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  MC_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, activeTeams: activeTeams, teamOf: teamOf,
    teamName: teamName, rosterName: rosterName, shortName: shortName,
    pushFeed: pushFeed, banner: banner, togglePov: togglePov,
    getState: function () { return lastState; }
  };
  window.__mcCore = core;   // the appended game block's follow-cam handle
  if (window.MinecraftChrome) window.MinecraftChrome.install(MC_CTX);

  core.start();
})();

    ['iron_pickaxe', 'IRON']

    '#': '#808084', 'c': '#48484c', 'i': '#b06c42', 'D': '#56d0d6',
    '=': '#2e2c2c', '!': '#e26a1e', 'B': '#1a1a1c', 't': '#8c6034',

    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (CTX) CTX.send('s:' + tick);
    });
    scrub.appendChild(el);
  }

  function feedRow(html, cls) {
    if (!CTX) return;
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    CTX.pushFeed(row);
  }

  function rungLabel(id) {
    for (var i = 0; i < MC_LADDER.length; i++) {
      if (MC_LADDER[i][0] === id) return MC_LADDER[i][1];
    }
    return String(id || '').toUpperCase();
  }

  // ---------------------------------------------------------------------
  //  The left gutter: the strata gauge and the milestone ladder panel
  // ---------------------------------------------------------------------
  function ensureLeftGutter() {
    var host = $('chrome');
    if (!host) return null;
    var left = $('mc-left');
    if (left) return left;
    left = document.createElement('div');
    left.id = 'mc-left';
    var strata = document.createElement('div');
    strata.id = 'mc-strata';
    for (var z = 0; z < 4; z++) {
      var band = document.createElement('div');
      band.className = 'band z' + z;
      band.title = ['y=64 (surface)', 'y=48 (stone)', 'y=32 (iron depth)',
        'y=12 (diamond depth)'][z];
      strata.appendChild(band);
    }
    var ladder = document.createElement('div');
    ladder.id = 'mc-ladder';
    for (var i = 0; i < MC_LADDER.length; i++) {
      var rung = document.createElement('div');
      rung.className = 'rung';
      rung.setAttribute('data-rung', MC_LADDER[i][0]);
      rung.title = (i + 1) + '. ' + MC_LADDER[i][1] + ' (+' +
        MC_LADDER[i][2] + ')';
      rung.innerHTML = '<span class="dot"></span>' +
        '<span class="cap">' + MC_LADDER[i][1] + '</span>' +
        '<span class="pts">+' + MC_LADDER[i][2] + '</span>' +
        '<span class="at"></span>';
      ladder.appendChild(rung);
    }
    left.appendChild(strata);
    left.appendChild(ladder);
    host.appendChild(left);
    return left;
  }

  function renderLadder(mc) {
    var ladder = $('mc-ladder');
    if (!ladder || !mc || !mc.ms) return;
    var rows = ladder.children;
    for (var i = 0; i < rows.length && i < mc.ms.length; i++) {
      var lit = mc.ms[i].t >= 0;
      rows[i].classList.toggle('lit', lit);
      var at = rows[i].querySelector('.at');
      if (at) at.textContent = lit ? String(mc.ms[i].t) : '';
      if (lit && !mcLitRungs[mc.ms[i].id]) {
        mcLitRungs[mc.ms[i].id] = true;
        rows[i].classList.remove('flash');
        void rows[i].offsetWidth;
        rows[i].classList.add('flash');
      } else if (!lit) {
        mcLitRungs[mc.ms[i].id] = false;
      }
    }
  }

  function renderStrata(mc) {
    var strata = $('mc-strata');
    if (!strata || !mc) return;
    var size = mc.size || 32;
    for (var z = 0; z < strata.children.length; z++) {
      var band = strata.children[z];
      band.classList.toggle('here', z === mc.z);
      band.innerHTML = '';
    }
    var shafts = mc.shafts || [];
    for (var i = 0; i < shafts.length && i < 64; i++) {
      var sz = shafts[i][0], sx = shafts[i][1];
      if (sz < 0 || sz >= strata.children.length) continue;
      var line = document.createElement('span');
      line.className = 'shaft';
      line.style.left = ((sx / size) * 100) + '%';
      strata.children[sz].appendChild(line);
    }
    var ore = mc.ore || [];
    for (var j = 0; j < ore.length && j < 48; j++) {
      if (ore[j].z < 0 || ore[j].z >= strata.children.length) continue;
      var pip = document.createElement('span');
      pip.className = 'pip ' + ore[j].w;
      pip.style.left = ((ore[j].x / size) * 100) + '%';
      pip.style.top = ((ore[j].y / size) * 100) + '%';
      strata.children[ore[j].z].appendChild(pip);
    }
    if (mc.z >= 0 && mc.z < strata.children.length) {
      var cog = document.createElement('span');
      cog.className = 'cog';
      cog.style.left = ((mc.x / size) * 100) + '%';
      cog.style.top = ((mc.y / size) * 100) + '%';
      strata.children[mc.z].appendChild(cog);
    }
  }

  // ---------------------------------------------------------------------
  //  The inventory strip
  // ---------------------------------------------------------------------
  function ensureInventory() {
    var host = $('chrome');
    if (!host) return null;
    var el = $('mc-inv');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'mc-inv';
    host.appendChild(el);
    return el;
  }

  function renderInventory(mc) {
    var el = ensureInventory();
    if (!el || !mc || !mc.inv) return;
    var html = '';
    for (var i = 0; i < MC_INV.length; i++) {
      var n = mc.inv[MC_INV[i][0]] || 0;
      html += '<span class="slot' + (n ? '' : ' zero') + '" title="' +
        MC_INV[i][0] + '"><span class="cap">' + MC_INV[i][1] + '</span> ' +
        n + '</span>';
    }
    for (var k = 0; k < MC_PICKS.length; k++) {
      var own = mc.tools && mc.tools[MC_PICKS[k][0]];
      html += '<span class="pick' + (own ? ' own' : '') + '" title="' +
        MC_PICKS[k][0] + '">' + MC_PICKS[k][1] + '</span>';
    }
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  //  The cog's own window, in the kept #fpv panel
  // ---------------------------------------------------------------------
  var fpvCtx2 = null;
  function renderAgentView(mc) {
    var panel = $('fpv');
    var canvas = $('fpv-canvas');
    if (!panel || !canvas || !mc || !mc.view || !mc.view.length) return;
    panel.classList.add('on');
    if (!fpvCtx2) fpvCtx2 = canvas.getContext('2d');
    var rows = mc.view;
    var n = rows.length;
    var cssW = canvas.clientWidth || 120, cssH = canvas.clientHeight || 120;
    var side = Math.max(1, Math.min(cssW, cssH));
    if (canvas.width !== side) canvas.width = side;
    if (canvas.height !== side) canvas.height = side;
    var cell = side / n;
    var ctx = fpvCtx2;
    ctx.clearRect(0, 0, side, side);
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        ctx.fillStyle = MC_GLYPH_COLOR[rows[y].charAt(x)] || '#05060a';
        ctx.fillRect(Math.floor(x * cell), Math.floor(y * cell),
          Math.ceil(cell), Math.ceil(cell));
      }
    }
    // No text is drawn onto any canvas here: the caption and the name are DOM.
    var cap = $('fpv-cap');
    if (cap) cap.textContent = 'AGENT VIEW ' + n + '\u00d7' + n;
    var name = $('fpv-name');
    if (name) {
      name.className = 'fpv-name';
      name.textContent = 'ALPHA \u00b7 ' + (mc.level || '') + ' \u00b7 FACING ' +
        String(mc.facing || '').toUpperCase();
    }
  }

  // ---------------------------------------------------------------------
  //  Follow-cam over a board that is much larger than the frame
  // ---------------------------------------------------------------------
  function applyCamera(mc, core) {
    if (!core || !mc) return;
    var t = core.getTransform ? core.getTransform() : null;
    if (followArmed && t && (!zoomApplied || t.zoom === 1)) {
      // fitScale = W/768 and showing k cells needs scale = W/(24k), so
      // zoom = 768/(24k) = 32/k independently of the container width.
      core.setZoom(32 / CAMERA_CELLS);
      zoomApplied = true;
    }
    if (followArmed && core.panTo) {
      core.panTo(mc.x * 24 + 12, mc.y * 24 + 12);
    }
    var read = $('zoom-read');
    if (read && t) {
      var cells = Math.max(1, Math.min(32, Math.round(32 / (t.zoom || 1))));
      var text = cells + ' CELLS';
      if (read.textContent !== text) read.textContent = text;
    }
  }

  // ---------------------------------------------------------------------
  //  The clock column
  // ---------------------------------------------------------------------
  function ensureLevelChip() {
    if ($('mc-level')) return $('mc-level');
    var clock = $('clock');
    if (!clock) return null;
    var el = document.createElement('div');
    el.id = 'mc-level';
    clock.appendChild(el);
    return el;
  }

  function renderClockColumn(s, mc) {
    var big = $('clock');
    if (big) {
      var head = big.querySelector('.time');
      if (head) head.textContent = mc.n + ' / ' + mc.of;
    }
    var caption = $('clock-caption');
    if (caption && s.ph !== 'lobby') {
      caption.textContent = 'score ' + mc.score + ' \u00b7 ' +
        Math.max(0, (s.mt || 0) - (s.t - (s.st || 0))) + ' ticks left';
    }
    var chip = ensureLevelChip();
    if (chip) {
      var text = (mc.level || '') + ' \u00b7 TICK ' +
        Math.max(0, s.t - (s.st || 0)) + '/' + (s.mt || 0);
      if (chip.textContent !== text) chip.textContent = text;
    }
  }

  // ---------------------------------------------------------------------
  //  The scorebug plate
  // ---------------------------------------------------------------------
  function renderPlate(s, mc) {
    var plate = document.querySelector('#plates-l .plate');
    if (!plate) return;
    var nameEl = plate.querySelector('.plate-name');
    if (nameEl && s.roster && s.roster.length) {
      var text = s.roster[0].name || 'ALPHA';
      if (nameEl.textContent !== text) nameEl.textContent = text;
    }
    var sub = plate.querySelector('.mc-sub');
    if (!sub) {
      sub = document.createElement('div');
      sub.className = 'mc-sub';
      plate.appendChild(sub);
    }
    var html = 'ALPHA \u00b7 ' + (mc.level || '') + ' \u00b7 ' + mc.n +
      '/' + mc.of + ' RUNGS \u00b7 ' + mc.score;
    if (mc.fallbacks > 0) html += ' <span class="mc-fallback">\u21af</span>';
    if (sub.innerHTML !== html) sub.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  //  The endcard
  // ---------------------------------------------------------------------
  function renderEndcard(s, mc) {
    var over = s.over;
    if (!over) return;
    var head = $('ec-headline');
    if (head) {
      var line;
      if (over.endRule === 'death') {
        line = 'STEPPED INTO LAVA AT ' + (over.deepest || '') + ', TICK ' +
          over.tick;
      } else if (over.endRule === 'diamond') {
        line = '11 OF 11 \u2014 DIAMOND AT TICK ' + over.tick;
      } else {
        line = over.milestones + ' OF ' + over.of + ' RUNGS \u2014 STOPPED AT ' +
          rungLabel(deepestId(mc)) + ', ' + over.tick + ' TICKS GONE';
      }
      head.textContent = line;
    }
    var wincond = $('ec-wincond');
    if (wincond) wincond.textContent = 'SCORE ' + over.score;
    var how = $('ec-how');
    if (how && mc) {
      how.textContent = mc.mined + ' blocks mined, ' + mc.dug +
        ' shafts cut, ' + mc.crafted + ' items crafted, ' + mc.seen + ' of ' +
        mc.cells + ' cells seen, deepest ' + (over.deepest || '') + ', ' +
        mc.interrupts + ' turns cut short by lava, ' + mc.fallbacks +
        ' fallback turns';
    }
    var teams = $('ec-teams');
    if (teams && mc && mc.ms) {
      var key = 'mc:' + over.tick + ':' + over.milestones;
      if (teams.getAttribute('data-mc-key') !== key) {
        teams.setAttribute('data-mc-key', key);
        var rows = '<div class="ec-thead"><span>#</span><span>Milestone</span>' +
          '<span>Points</span><span>Tick</span><span>Level</span></div>';
        for (var i = 0; i < mc.ms.length; i++) {
          var lit = mc.ms[i].t >= 0;
          rows += '<div class="ec-trow' + (lit ? '' : ' dim') + '">' +
            '<span>' + (i + 1) + '</span>' +
            '<span>' + rungLabel(mc.ms[i].id) + '</span>' +
            '<span>+' + mc.ms[i].p + '</span>' +
            '<span>' + (lit ? mc.ms[i].t : '\u2014') + '</span>' +
            '<span>' + (lit ? levelOfRung(i) : '\u2014') + '</span></div>';
        }
        teams.innerHTML = '<div class="ec-team"><div class="ec-tname">THE RUN' +
          '</div>' + rows + '</div>';
      }
    }
  }

  function deepestId(mc) {
    var id = 'none';
    if (!mc || !mc.ms) return id;
    for (var i = 0; i < mc.ms.length; i++) {
      if (mc.ms[i].t >= 0) id = mc.ms[i].id;
    }
    return id;
  }

  function levelOfRung(i) {
    if (i <= 3) return 'y=64';
    if (i <= 5) return 'y=48';
    if (i <= 9) return 'y=32';
    return 'y=12';
  }

  // ---------------------------------------------------------------------
  //  Events -> feed rows and beats
  // ---------------------------------------------------------------------
  function mcEvent(e, s, ctx) {
    CTX = ctx;
    switch (e.k) {
      case 'milestone':
        mcBeat(s, e.t, 'milestone',
          'Rung ' + e.n + '/' + e['of'] + ' \u2014 ' + rungLabel(e.id) +
          ' (+' + e.points + ') \u2014 click to jump here');
        feedRow('<span class="mc-rung">\u2605 RUNG ' + e.n + '/' + e['of'] +
          ' \u2014 ' + CTX.esc(rungLabel(e.id)) + ' (+' + e.points + ')</span>');
        CTX.banner('RUNG ' + e.n + '/' + e['of'] + ' \u2014 ' +
          rungLabel(e.id), 'amb');
        return true;
      case 'descend':
        if (e.first) {
          mcBeat(s, e.t, 'newdepth',
            'First arrival at ' + e.to + ' \u2014 click to jump here');
        }
        feedRow('<span class="badge">DUG DOWN TO ' + CTX.esc(e.to) + '</span>');
        return true;
      case 'ascend':
        feedRow('<span class="badge">CLIMBED BACK TO ' + CTX.esc(e.to) +
          '</span>');
        return true;
      case 'death':
        mcBeat(s, e.t, 'death', 'The cog stepped into lava \u2014 click to jump here');
        feedRow('<span class="who red">ALPHA</span>' +
          '<span class="glyph">\u203a</span>' +
          '<span class="badge">STEPPED INTO LAVA</span>');
        return true;
      case 'end':
        mcBeat(s, e.t, 'end',
          e.milestones + ' of ' + e['of'] + ' rungs \u2014 click to jump here');
        return false;   // the endcard is state-driven; let the page see it too
      case 'lava':
        feedRow('<span class="badge">LAVA BESIDE THE COG \u2014 TURN CUT SHORT</span>');
        return true;
      case 'bridge':
        feedRow('<span class="badge">BRIDGED OVER THE LAVA</span>');
        return true;
      case 'smelt':
        feedRow('<span class="badge">SMELTED AN IRON INGOT</span>');
        return true;
      case 'craft':
        feedRow('<span class="badge">CRAFTED SOMETHING</span>');
        return true;
      case 'mine':
      case 'place':
      case 'blocked':
      case 'turn':
      case 'plan':
        return true;    // continuous work; the BOARD is that readout
    }
    return false;
  }

  // The directive lines: the plan and the cog's own `say` are what a spectator
  // actually sees the LLM doing, so they get their own feed rows.
  var mcSeenDirective = {};
  function mcDirectives(s) {
    var records = s.directives;
    if (!records || !records.length) return;
    for (var i = 0; i < records.length; i++) {
      var d = records[i];
      var key = d.turn + ':' + d.slot;
      if (mcSeenDirective[key]) continue;
      mcSeenDirective[key] = true;
      if (d.source === 'fallback') {
        feedRow('<span class="badge">MISSED THE CALL \u2014 miner plan</span>');
      }
      if (d.say) {
        feedRow('<span class="who red">Alpha</span><span class="glyph">:</span>' +
          '<span class="mc-say">\u201c' + CTX.esc(d.say) + '\u201d</span>');
      }
    }
  }

  // ---------------------------------------------------------------------
  //  The per-frame entry point
  // ---------------------------------------------------------------------
  function mcFrame(s, ctx, jumped) {
    CTX = ctx;
    if (jumped) {
      mcPlaced = {};
      mcSeenDirective = {};
      mcLitRungs = {};
    }
    var mc = s.mc;
    if (!mc) return;
    ensureLeftGutter();
    renderLadder(mc);
    renderStrata(mc);
    renderInventory(mc);
    renderAgentView(mc);
    renderClockColumn(s, mc);
    renderPlate(s, mc);
    if (s.ph === 'gameover') renderEndcard(s, mc);
    mcDirectives(s);
    if (mc.z !== mcLastLevel) mcLastLevel = mc.z;
    if (window.__mcCore) applyCamera(mc, window.__mcCore);
    // The up-front beat timeline, shipped ONCE by the server, places every
    // marker before playback reaches it - as labelled buttons.
    if (s.beats && s.beats.length) {
      for (var i = 0; i < s.beats.length; i++) {
        var b = s.beats[i];
        if (b.k === 'milestone') {
          mcBeat(s, b.t, 'milestone',
            'Rung ' + b.n + '/' + b['of'] + ' \u2014 ' + rungLabel(b.id) +
            ' \u2014 click to jump here');
        } else if (b.k === 'newdepth') {
          mcBeat(s, b.t, 'newdepth',
            'First arrival at ' + b.to + ' \u2014 click to jump here');
        } else if (b.k === 'death') {
          mcBeat(s, b.t, 'death', 'The cog stepped into lava \u2014 click to jump here');
        } else if (b.k === 'fallback') {
          mcBeat(s, b.t, 'fallback',
            'The seat missed its call (' + (b.cause || '') +
            ') \u2014 click to jump here');
        } else if (b.k === 'end') {
          mcBeat(s, b.t, 'end',
            b.milestones + ' rungs \u2014 click to jump here');
        }
      }
    }
  }

  window.MinecraftChrome = {
    install: function (ctx) {
      CTX = ctx;
      ensureLeftGutter();
      ensureInventory();
      // A user pan or a minimap drag disarms follow; the starter's own
      // resetView binding re-arms it and restores cameraCells = 15.
      var reset = document.getElementById('zoom-slider');
      if (reset) {
        reset.addEventListener('input', function () { followArmed = false; });
      }
      var mm = document.getElementById('minimap');
      if (mm) {
        mm.addEventListener('pointerdown', function () { followArmed = false; });
      }
      var board = document.getElementById('board');
      if (board) {
        board.addEventListener('pointerdown', function () { followArmed = false; });
      }
      window.addEventListener('keydown', function (ev) {
        if (ev.key === '0') { followArmed = true; zoomApplied = false; }
      });
    },
    frame: mcFrame,
    event: mcEvent,
    // The renderer fixture's ONE hook: it drives this exact drawing code with a
    // synthetic state so CI covers the paths a scripted smoke replay can never
    // reach (a full-cap `say`, every ladder chip lit, each endcard shape). It
    // never re-implements the drawing (the particle-worlds 2026-08-26 scar).
    __fixture: function (state) { mcFrame(state, CTX || window.MC_CTX, true); }
  };
})();
</script>

</body>
