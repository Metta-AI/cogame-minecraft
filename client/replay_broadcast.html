@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  line-height: 1;
  color: var(--paper);
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* Team-perk badges, riding the squad-pip strip (the pip strip IS the life
   meter — see renderSquad). Each policy's pips form one .squad-pol block
   with that policy's badges beside them; the center-adjacent pips with
   badges flanking OUTSIDE come from renderSquad's fixed DOM order
   (group 0: icons,pips; group 1: pips,icons), never from side-reversal CSS
   — see the .squad-pol comment below for why mirroring was removed. Badges
   keep each perk's own fixed color (never team-tinted). */
.plate .perk-icos {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.plate .perk-ico { display: inline-flex; }
.plate .perk-ico svg {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  display: block;
}
/* Handicap chip: an amber pill next to the team name when that team is
   weakened. The full delta breakdown rides in the native `title` on hover
   (cursor:help hints it). Hidden entirely for an unhandicapped team. */
.plate .hcap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--ink);
  background: var(--amber);
  border-radius: calc(3 * var(--u));
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  flex: none;
  cursor: help;
  white-space: nowrap;
}
/* Squad strip: ONE pip per player (8). Each pip is a tiny pie: the filled
   wedge is that seat's remaining lives (full square = all lives, a sliver =
   last life), dim = down-but-respawning, hollow = eliminated. The strip is
   the "who's left" read; the big numeral is the exact lives count. Each pip
   is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(6 * var(--u));
  margin-top: calc(3 * var(--u));
}
.plate.side-r .squad { justify-content: flex-end; }
/* Policy groups keep the HEADLINE's left-to-right order on BOTH plates — the
   first-named policy's pips are always the left group, so a badge reads as
   belonging to the name it sits under. (No side mirroring: an early version
   reversed the strip on side-l for clock-symmetry, which visually attached
   the left badges to the wrong policy name.) */
.squad-pol {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  /* --fill (0..1) = lives left / max lives; wedge sweeps clockwise from 12 */
  background: conic-gradient(currentColor calc(var(--fill, 1) * 1turn), transparent 0);
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
/* faint frame so a part-filled pie still reads as one square slot */
.squad-pip::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) currentColor;
  opacity: 0.35;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.out::after { display: none; }       /* .out draws its own outline */
.squad-pip.carry {                                            /* has the flag */
  background: conic-gradient(var(--amber) calc(var(--fill, 1) * 1turn), transparent 0);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate .squad { color: var(--tc, var(--paper)); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier) /
   CAPTURED (GV32: retired, team eliminated — drawn like TAKEN). F2. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
  /* An outermost flag icon sits at the screen edge; an unclamped centered
     tag would poke past it (seen as stray clipped names at the band edges
     in 4-team games). */
  max-width: calc(58 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3 */
.plate.leader .lives-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* Roster rails removed: per-player state now rides the scorebug squad strip
   (the roster IS the counter, genre convention) and the board's own name tags.
   No floating bordered rails over the arena flanks (in-world, no HUD chrome). */

/* POV eye badge shown when a slot is inspected (fog-honesty lens) */
#povBadge {
  position: absolute;
  top: calc(64 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--ink-soft);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  z-index: 12;
  cursor: pointer;
}
#povBadge.on { display: flex; }

/* First-person PiP inset: pinned bottom-LEFT (the killfeed owns bottom-right, so
   they never overlap), responsive width (§2 — sized off the stage so it scales
   with the composition). Hidden until a seat is in POV. One quiet hairline
   frames it as a genuine window, not a decorative card. */
#fpv {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(64 * var(--u));
  /* Sized/positioned in px once dragged or resized; these are the defaults. */
  width: 30%;
  min-width: calc(150 * var(--u));
  max-width: calc(460 * var(--u));
  aspect-ratio: 3 / 2;
  display: none;
  z-index: 11;
  background: rgba(12, 9, 6, 0.42);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.34),
    0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(8, 5, 3, 0.45);
  overflow: hidden;
  /* See-through so it never fully hides the arena beneath; grab anywhere to
     move, drag the corner grip to resize. */
  opacity: 0.82;
  cursor: grab;
  transition: opacity 0.12s ease;
}
#fpv.on { display: block; }
#fpv:hover { opacity: 0.97; }
#fpv.dragging, #fpv.resizing { cursor: grabbing; opacity: 0.99; }
#fpv.resizing { cursor: nwse-resize; }
/* Once dragged/resized we pin via left/top + explicit width and drop the
   left/bottom + aspect-ratio anchors so nothing fights. */
#fpv.moved { left: auto; bottom: auto; }
#fpv.sized { aspect-ratio: auto; max-width: none; min-width: 0; }
#fpv-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  pointer-events: none;   /* clicks fall through to the frame for dragging */
}
/* Resize grip: bottom-right corner (bottom-left is the screen edge when pinned
   bottom-left). The ONLY child that takes pointer events, so drag-to-move works
   everywhere else. */
.fpv-grip {
  position: absolute;
  right: 0; bottom: 0;
  width: calc(16 * var(--u));
  height: calc(16 * var(--u));
  cursor: nwse-resize;
  z-index: 5;
  background:
    linear-gradient(-45deg, transparent 40%, rgba(232, 163, 61, 0.55) 42%,
      rgba(232, 163, 61, 0.55) 46%, transparent 48%,
      transparent 58%, rgba(232, 163, 61, 0.55) 60%,
      rgba(232, 163, 61, 0.55) 64%, transparent 66%);
  opacity: 0.6;
}
.fpv-grip:hover { opacity: 1; }
.fpv-cap {
  position: absolute;
  left: calc(6 * var(--u));
  top: calc(4 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  opacity: 0.85;
  z-index: 3;
}

/* Self-status HUD: a thin bottom bar reading like a soldier's own readout —
   name at the left, hp as pips, carried gear at the right. Sits over the floor
   half of the raycast so it never masks the horizon action. */
.fpv-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: linear-gradient(0deg, rgba(8, 5, 3, 0.82), rgba(8, 5, 3, 0));
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  z-index: 3;
}
.fpv-name {
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.fpv-name { color: var(--tc, var(--paper)); }

/* Un-fogged tactical minimap inset: top-right corner, BOARD aspect. Compact and
   see-through so it reads as an overlay on the raycast, not a lid over it. A
   quiet hairline frames it as a genuine window. pointer-events:none so grabbing
   it still drags the whole PiP.
   The width/aspect-ratio here are PRE-STREAM DEFAULTS (the classic arena) —
   syncFpvMapShape() overwrites both from the streamed map's real w/h, because a
   four-team board is square and a fixed 1.874:1 inset squashes it. */

/* ---------- 4b. VIEW CONTROLS (zoom + minimap) ----------
   One group, top-right, under the reserved scorebug band: the minimap sits
   directly over the control that summoned it, so "where am I" and "how far in
   am I" read as a single instrument instead of two scattered widgets.
   The board is NOT scroll-zoomed — a trackpad two-finger scroll belongs to the
   page — so these controls are the primary way in, not a fallback, and they are
   always present. The minimap only appears once there is something off-screen
   to locate (zoom > 1); at fit it would just be the board again, smaller. */
#viewpanel {
  position: absolute;
  top: calc(var(--topband, 0px) + 10 * var(--u));
  right: calc(12 * var(--u));
  z-index: 11;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: calc(5 * var(--u));
  font-family: var(--pixfont);
  /* Minimap and zoom bar share ONE width so the pair reads as a single stacked
     instrument rather than two overlays that happen to be near each other.
     The px floor is a TOUCH floor: chrome otherwise scales with the embed, and
     a 300px-wide Observatory card would shrink the buttons below a fingertip. */
  --viewpanel-w: max(calc(178 * var(--u)), 132px);
}

/* Board minimap. Aspect + display come from the STREAMED board's real w/h
   (syncMinimapShape), because a four-team board is square and a fixed 1.874:1
   inset would squash it. See-through so it reads as an overlay on play. */
#minimap {
  position: relative;
  width: var(--viewpanel-w);
  aspect-ratio: 1235 / 659;
  background: rgba(8, 5, 3, 0.5);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.3);
  overflow: hidden;
  cursor: crosshair;
  display: none;
}
#minimap.on { display: block; }
#minimap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
/* The label rides INSIDE the frame rather than adding a header row above it —
   one element, not two stacked boxes. */
#minimap .mm-cap {
  position: absolute;
  left: calc(4 * var(--u));
  bottom: calc(2 * var(--u));
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-dim);
  text-shadow: 0 1px 2px rgba(8, 5, 3, 0.9);
  pointer-events: none;
}

#zoombar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  width: var(--viewpanel-w);
  padding: calc(3 * var(--u)) calc(5 * var(--u));
  /* Opaque enough that the buttons keep their contrast over pale concrete —
     a control you have to hunt for on a bright floor is not a control. */
  background: rgba(12, 9, 6, 0.82);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.22);
}
.zbtn {
  font-family: var(--pixfont);
  font-size: calc(14 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  flex: none;
  width: max(calc(20 * var(--u)), 22px);
  height: max(calc(18 * var(--u)), 20px);
  cursor: pointer;
  padding: 0;
}
.zbtn:hover { background: rgba(242, 232, 216, 0.22); }
.zbtn:disabled { opacity: 0.3; cursor: default; background: rgba(242, 232, 216, 0.05); }
/* Zoom is geometric (1x..12x); the slider's travel is the LOG of it, so equal
   thumb movement is equal perceived zoom rather than a dead left half. */
#zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1 1 auto;
  width: auto;
  min-width: 0;
  margin: 0;
  height: calc(2 * var(--u));
  background: rgba(242, 232, 216, 0.22);
  cursor: pointer;
}
#zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: calc(9 * var(--u));
  height: calc(13 * var(--u));
  background: var(--amber);
  cursor: grab;
}
#zoom-slider::-moz-range-thumb {
  width: calc(9 * var(--u));
  height: calc(13 * var(--u));
  border: none;
  border-radius: 0;
  background: var(--amber);
  cursor: grab;
}
#zoom-slider:focus-visible { outline: 1px solid var(--amber); outline-offset: calc(3 * var(--u)); }
/* Never a bare number: the readout carries its unit, and "FIT" names the state
   the board opens in instead of showing a meaningless 1.0x. */
#zoom-read {
  font-size: max(calc(9 * var(--u)), 9px);
  letter-spacing: 0.06em;
  color: var(--paper-dim);
  flex: none;
  width: max(calc(26 * var(--u)), 26px);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#zoom-read.zoomed { color: var(--amber); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* kill ticks are short and colored by the KILLER's team (a red tick = red
   scored a kill); team-kills and unattributable pileups stay neutral. */
.beat-marker.kill { background: var(--tc, var(--paper-dim)); height: calc(6 * var(--u)); }
/* flag beats are colored by the FLAG's team, matching the banners ("RED
   HEART TAKEN"): steal = full tick with a flag head, return = same tick
   dimmed (the heart snapped home), capture = the chunky match point in the
   CAPTURING team's color. */
.beat-marker.steal { background: var(--tc, var(--amber)); }
.beat-marker.steal::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: calc(5 * var(--u));
  height: calc(3 * var(--u));
  background: inherit;
}
.beat-marker.return { background: var(--tc, var(--paper-dim)); opacity: 0.45; }
.beat-marker.capture { background: var(--tc, var(--amber)); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* a 4-team match can retire several rival hearts (GV32: a capture eliminates
   its team and play continues), so the Cap cell lays its hearts in a row,
   later hearts shingling over earlier ones so three still fit the column */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

  display: inline-block;

  vertical-align: middle;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  image-rendering: pixelated;

/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }

/* Opt-OUT of the #viewpanel overlay (zoom bar + minimap) by param only:
   ?viewpanel=0 sets body[data-noviewpanel]. Defaults are unchanged everywhere
   — the League Replayer shell loads the board with ?embed=1 and KEEPS zoom +
   minimap (that's why #271 blanket-hiding the panel in all embeds was reverted
   in #272). Only surfaces that explicitly ask — billboards (Lobby hero) and
   thumbnail capture — append &viewpanel=0 to drop the panel. Independent of
   embed: the two params don't touch each other. */
body[data-noviewpanel] #viewpanel { display: none !important; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain: the bot locker room. The six art frames (srcs set by
       buildLockerRoom — the path prefix is delivery-mode dependent) play as a
       ~4fps idle loop; the whole scene fades out on the first ingested
       frame (dismissLockerRoom). role=status so screen readers hear one
       "Loading replay" while the visual squad preps their markers. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Generating the world&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Cog workshop &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Plates are generated per active team (2-4) by ensureScorebug(): one
         per side for classic red/blue, two stacked per side for 3-4 teams.
         Each plate holds a flag icon, one inline NAME · Lives · count row
         (mirrored on the right so names flank the clock), and the squad pip
         strip (one pip per player: alive / down / eliminated; clickable →
         POV lens). -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Waiting for the cog</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <!-- View controls: zoom the board with buttons/slider/keys/pinch (never a
         plain scroll — that belongs to the page), and once zoomed, a minimap
         with a white view box says which part of the board you are holding.
         Click or drag the minimap to jump the view there. -->
    <div id="viewpanel">
      <div id="minimap" title="Click or drag to move the view">
        <canvas id="minimap-canvas"></canvas>
        <span class="mm-cap">View</span>
      </div>
      <div id="zoombar" role="group" aria-label="Board zoom">
        <button class="zbtn" id="zoom-out" title="Zoom out (x)" aria-label="Zoom out">&minus;</button>
        <input id="zoom-slider" type="range" min="0" max="1000" step="1" value="0"
               aria-label="Board zoom" aria-valuetext="Fitted">
        <button class="zbtn" id="zoom-in" title="Zoom in (z)" aria-label="Zoom in">+</button>
        <span id="zoom-read" aria-live="off">15 CELLS</span>
      </div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded actions</div>
    <!-- First-person picture-in-picture: the selected seat's Wolfenstein-style
         raycast view, shown only while a player is in POV. A window into what
         that soldier sees down the barrel, riding alongside their top-down fog.
         Its own inset tactical map (bottom-left) shows the seat's position and
         vision cone against the WHOLE un-fogged arena, so the viewer always
         knows where the EYES are looking and standing. -->
    <div id="fpv">
      <canvas id="fpv-canvas"></canvas>
      <!-- Self-status HUD: this soldier's hp pips, lives, carried gear. -->
      <div class="fpv-hud" id="fpv-hud">
        <span class="fpv-name" id="fpv-name"></span>
      </div>
      <div class="fpv-cap" id="fpv-cap">AGENT VIEW 11&times;11</div>
      <!-- corner grip: drag to resize (bottom-right so it clears the screen edge
           when the PiP is pinned bottom-left) -->
      <div class="fpv-grip" id="fpv-grip" title="Drag to resize"></div>
    </div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: milestones and the ending on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">MILESTONE TIMELINE</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // Shared replay chrome (chrome_common.js, spliced over the CHROME_COMMON
  // marker by the server / dist bundle; the literal marker must not appear
  // inside this script or the splice would corrupt it). A raw file:// open of
  // this source has no splice — same non-functional baseline as the missing
  // BROADCAST_CORE — so fail loud and early instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    sendPov: function (slot) { send('v:' + slot); },
    getState: function () { return lastState; }
  });
  // Aliases so the per-view code below reads exactly as before.
  var RED = C.RED, BLUE = C.BLUE, AMBER = C.AMBER, PAPER = C.PAPER;
  var GREEN = C.GREEN, YELLOW = C.YELLOW;
  var TEAM_ORDER = C.TEAM_ORDER, TEAM_COLOR = C.TEAM_COLOR;
  var teamCol = C.teamCol, activeTeams = C.activeTeams, teamOf = C.teamOf;
  var otherTeam = C.otherTeam, stripSeatSuffix = C.stripSeatSuffix;
  var teamPolicies = C.teamPolicies, teamName = C.teamName, teamHeadline = C.teamHeadline;
  var rosterName = C.rosterName, setName = C.setName, esc = C.esc, fmt = C.fmt;
  var setHandicap = C.setHandicap;
  var teamPerkGroups = C.teamPerkGroups, perkIconsHtml = C.perkIconsHtml;
  var togglePov = C.togglePov, renderClock = C.renderClock, renderTransport = C.renderTransport;
  var ingestLullSpans = C.ingestLullSpans, renderLullSpans = C.renderLullSpans;
  var markBeat = C.markBeat, killMarkerTeam = C.killMarkerTeam, renderBeatMarkers = C.renderBeatMarkers;
  var captureTeam = C.captureTeam, ingestBeats = C.ingestBeats, setVerdict = C.setVerdict;
  var ingestLeadSeries = C.ingestLeadSeries, recordMomentum = C.recordMomentum;
  var renderMomentum = C.renderMomentum;
  var getSpoilers = C.getSpoilers, setSpoilers = C.setSpoilers;

  // ---- eye-level cog art for the EYES PiP billboards ----
  // The PiP is an eye-level raycaster, so its billboards need art drawn from a
  // HORIZONTAL camera: soldier_{red,blue}_front.png is the real cog standing on
  // its wheels, square to the viewer, with the cyan smile visor tilted up toward
  // the camera (built by scripts/art/build_cvc_front.py, served as a static PNG).
  //
  // The plain soldier_{red,blue}.png masters are the TOP-DOWN BOARD sprites (the
  // cog as seen from ABOVE). Blitting those here is what made a near cog read as
  // a flat team-coloured plate with the smile squashed onto its bottom edge —
  // "a head on the ground". No trim or pose math fixes that; it is the wrong
  // camera. They stay only as the pre-load fallback, ranked behind the front art.
  //
  // Loaded once; drawFpvEntity blits the matching team image scaled to the
  // projected figure so distant cogs shrink like everything else.
  // Two poses per team: _gun (the cog holding its paintball marker forward at the
  // camera) is what a LIVE cog shows, since every live cog carries its gun; the
  // empty-handed master rides as the fallback until that one loads.
  //
  // COG_BASE, not a root-absolute "/client/…": this page is served from THREE
  // places and a leading slash is only correct at one of them.
  //  - native server, bare:      /client/replay        → "" + /client/…
  //  - native server, proxied:   /<prefix>/client/replay (Kubernetes service
  //    proxy) — a leading slash would drop <prefix> and 404.
  //  - the STATIC WASM BUNDLE:   /v2/coworlds/replays/static/<coworld>/<hash>/
  //    index.html, where the PNGs sit NEXT TO the page and there is no server
  //    at all — a leading slash resolves to the API origin root and 404s.
  // Stripping the trailing "/client/<page>" recovers the prefix, so the same
  // expression serves all three. Mirrors ART_BASE in league_replayer.html and
  // websocketPathForClientPage() in broadcast_core.js, which map the same
  // /client + /clients route pair the same way. The bundle is detected by its
  // WASM adapter rather than a URL param: window.CtfStaticReplay only exists
  // when static_replay.js is on the page.
  var COG_BASE = window.CtfStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';
  var COG_ART = {}, COG_ART_GUN = {};
  ['red', 'blue', 'green', 'yellow'].forEach(function (team) {
    COG_ART[team] = new Image();
    COG_ART[team].src = COG_BASE + '/soldier_' + team + '_front.png';
    COG_ART_GUN[team] = new Image();
    COG_ART_GUN[team].src = COG_BASE + '/soldier_' + team + '_front_gun.png';
  });
  function cogArtReady(img) { return img && img.complete && img.naturalWidth > 0; }
  // Pick the armed pose when it's ready, else the plain one, else null (the
  // caller falls back to the procedural chassis).
  function cogArtFor(team, armed) {
    var gun = COG_ART_GUN[team], plain = COG_ART[team];
    if (armed && cogArtReady(gun)) return gun;
    if (cogArtReady(plain)) return plain;
    return cogArtReady(gun) ? gun : null;
  }
  // The front masters are trimmed to their opaque box at build time and carry NO
  // baked drop shadow (the billboard draws its own contact shadow), so the whole
  // image IS the cog — a full-frame trim, unlike the top-down master which bakes
  // a soft shadow into its right third and needs the box cut out.
  var COG_TRIM = { x: 0, y: 0, w: 1, h: 1 };
  var COG_ASPECT = 180 / 192;   // 0.9375 — w/h of the front master (build script prints it)
  // Offscreen scratch for depth-dimming the cog sprite: draw the art in, then
  // darken with a source-atop ink wash so ONLY the sprite pixels dim (never the
  // floor/walls already painted behind it). Reused across draws.
  var cogScratch = document.createElement('canvas'), cogScratchCtx = null;
  // Engine-authoritative wire constants (read via the shared chrome; the
  // fallback literals for raw file:// opens live in chrome_common.js).
  var WIRE = C.WIRE, SPEEDS = C.SPEEDS, FPS = C.FPS;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = C.$;
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- pre-load curtain: the bot locker room -------------------------------
  // The stage opens on this scene (see #lockerroom CSS) while the socket /
  // wasm sim boots. The art frames are wired here (their base path is
  // delivery-mode dependent, like the cog art); the first ingested frame
  // calls dismissLockerRoom(), which fades the room out after a short
  // minimum dwell (a sub-second load would otherwise flash the scene like
  // a glitch).
  var lockerEl = $('lockerroom');
  var LOCKER_MIN_DWELL_MS = 900;
  var lockerShownAt = Date.now();
  var lockerCapTimer = null, lockerGone = false;
  (function buildLockerRoom() {
    // Scene art (nanobanana generations, like the shell's dungeon walls):
    // bg.jpg is the empty-room plate; each bot is five freestanding alpha
    // sprites (<bot>_<pose>.webp) cut from the generated pose frames. Same
    // three-delivery-modes path story as the cog art, so the base derives
    // from COG_BASE: native "<prefix>/client" + "/art/lockerroom", static
    // bundle "./art/lockerroom".
    var artBase = COG_BASE + '/art/lockerroom';
    $('lk-bg').src = artBase + '/bg.jpg';

    // Sprite geometry baked by the extraction script (scripts prompt in the
    // PR): ax/ay anchor each bot's bottom-center on the plate, w/h size each
    // pose — all in % of the 992x926 plate, so everything scales together.
    // Distinct cycle lengths keep the four carousels out of phase; the
    // composed scene state repeats only every few minutes.
    var LK_BOTS = {
      green:  { ax: 22.83, ay: 76.67, cyc: 4.6,
        poses: [{ f: 1, w: 14.82, h: 18.03 }, { f: 2, w: 14.92, h: 18.25 },
                { f: 3, w: 14.62, h: 18.14 }, { f: 5, w: 14.82, h: 18.25 },
                { f: 6, w: 14.62, h: 19.01 }] },
      blue:   { ax: 41.08, ay: 76.67, cyc: 3.8,
        poses: [{ f: 1, w: 16.63, h: 18.25 }, { f: 2, w: 14.92, h: 21.6 },
                { f: 3, w: 15.83, h: 21.81 }, { f: 5, w: 16.63, h: 20.63 },
                { f: 6, w: 14.62, h: 22.68 }] },
      yellow: { ax: 59.93, ay: 76.78, cyc: 5.2,
        poses: [{ f: 1, w: 16.43, h: 18.57 }, { f: 2, w: 15.52, h: 18.57 },
                { f: 3, w: 15.62, h: 18.57 }, { f: 5, w: 16.13, h: 18.36 },
                { f: 6, w: 15.83, h: 23.11 }] },
      red:    { ax: 79.03, ay: 77.43, cyc: 4.1,
        poses: [{ f: 1, w: 18.15, h: 18.79 }, { f: 2, w: 15.93, h: 20.19 },
                { f: 3, w: 15.52, h: 19.87 }, { f: 5, w: 15.83, h: 20.63 },
                { f: 6, w: 16.73, h: 21.06 }] }
    };
    var spritesEl = $('lk-sprites');
    ['green', 'blue', 'yellow', 'red'].forEach(function (bot) {
      var b = LK_BOTS[bot];
      var maxW = 0, maxH = 0;
      b.poses.forEach(function (p) {
        maxW = Math.max(maxW, p.w);
        maxH = Math.max(maxH, p.h);
      });
      var wrap = document.createElement('div');
      wrap.className = 'lk-boto';
      wrap.style.left = (b.ax - maxW / 2) + '%';
      wrap.style.top = (b.ay - maxH) + '%';
      wrap.style.width = maxW + '%';
      wrap.style.height = maxH + '%';
      b.poses.forEach(function (p, ix) {
        var img = document.createElement('img');
        img.alt = '';
        img.src = artBase + '/' + bot + '_' + p.f + '.webp';
        // widths are % of the plate; inside the wrapper they rescale by maxW
        img.style.width = (p.w / maxW * 100) + '%';
        img.style.setProperty('--cyc', b.cyc + 's');
        img.style.animationDelay = (ix * b.cyc / b.poses.length) + 's';
        wrap.appendChild(img);
      });
      spritesEl.appendChild(wrap);
    });

    // Pin the sprite plane to the bg image's on-screen box (the img is the
    // flex-fitted sizer; % geometry above resolves against this plane).
    var bgImg = $('lk-bg');
    function fitLockerSprites() {
      spritesEl.style.left = bgImg.offsetLeft + 'px';
      spritesEl.style.top = bgImg.offsetTop + 'px';
      spritesEl.style.width = bgImg.offsetWidth + 'px';
      spritesEl.style.height = bgImg.offsetHeight + 'px';
    }
    bgImg.addEventListener('load', fitLockerSprites);
    if (window.ResizeObserver) new ResizeObserver(fitLockerSprites).observe(bgImg);
    window.addEventListener('resize', fitLockerSprites);
    fitLockerSprites();

    // rotating prep-talk line under the scene
    var lines = [
      'Filling hoppers with fresh paint…',
      'Pump check: one, two. One, two…',
      'Polishing visors to a mirror shine…',
      'Shaking the paint pods awake…',
      'Squats. Even robots warm up…',
      'Topping off the CO₂…',
      'Chalking up the wheels…',
      'Reviewing the game plan…'
    ];
    var capEl = $('lk-cap'), capIx = 0;
    lockerCapTimer = setInterval(function () {
      capEl.classList.add('swap');
      setTimeout(function () {
        capIx = (capIx + 1) % lines.length;
        capEl.textContent = lines[capIx];
        capEl.classList.remove('swap');
      }, 180);
    }, 2600);
  })();
  function dismissLockerRoom() {
    if (lockerGone) return;
    lockerGone = true;
    var wait = Math.max(0, LOCKER_MIN_DWELL_MS - (Date.now() - lockerShownAt));
    setTimeout(function () {
      lockerEl.classList.add('gone');
      setTimeout(function () {
        lockerEl.style.display = 'none';
        if (lockerCapTimer) { clearInterval(lockerCapTimer); lockerCapTimer = null; }
      }, 650);
    }, wait);
  }

  // ---- embed mode (League Replayer) ----------------------------------------
  // When loaded inside the League Replayer shell (?embed=1), this client renders
  // ONLY the board (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent shell
  // over postMessage. The shell owns the walls + scorebug + KDA + standings and
  // draws them from this stream, so there is ONE websocket / ONE transport /
  // perfect tick-sync between the embedded game and the wall HUD.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');

  // ?viewpanel=0 hides the #viewpanel overlay (zoom bar + minimap). This is an
  // explicit opt-OUT only — the default (param absent) is unchanged for every
  // existing embed, so the League Replayer still shows zoom + minimap. See the
  // #271/#272 lesson: hiding the panel for ALL embeds broke the Replayer shell.
  // Billboards (Lobby hero) and thumbnail capture append &viewpanel=0.
  try {
    if (new URLSearchParams(location.search).get('viewpanel') === '0')
      document.body.setAttribute('data-noviewpanel', '1');
  } catch (e) {}

  // Tick deep-link (?t=<tick>): seek there on load, paused, via the same s:
  // command the scrubber uses (the sim clamps out-of-range ticks). One-shot,
  // fired on the first ingested frame so the replay runtime is ready.
  var SEEK_T = null;
  try {
    var seekRaw = new URLSearchParams(location.search).get('t');
    if (seekRaw != null && /^\d+$/.test(seekRaw)) SEEK_T = parseInt(seekRaw, 10);
  } catch (e) {}

  // Achievement deep-link (?achievement=<id>): a badge's watch link. The lead
  // chrome frame carries the final game's earned badges with their focus cogs
  // (s.ach: [{id, s, n}]); when it arrives, select the receiving cog's POV via
  // the same v: command a squad-pip click sends. One-shot: once applied (or the
  // id turns out unearned in this recording) the param goes inert, so the
  // viewer is free to click elsewhere.
  var ACH_FOCUS = null;
  try {
    var achRaw = new URLSearchParams(location.search).get('achievement');
    if (achRaw) ACH_FOCUS = achRaw;
  } catch (e) {}
  function applyAchievementFocus(s) {
    if (ACH_FOCUS == null || !s.ach) return;
    var want = ACH_FOCUS;
    ACH_FOCUS = null;             // the lead frame ships once; so does this
    for (var i = 0; i < s.ach.length; i++) {
      if (s.ach[i].id === want && s.ach[i].s != null && s.ach[i].s >= 0) {
        send('v:' + s.ach[i].s);
        return;
      }
    }
  }
  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'ctf-replay', type: type, data: payload }, '*'); } catch (e) {}
  }

  // The whole replay is ONE fixed-aspect composition locked to the board's
  // native size. The stage is sized to this aspect inside the embed box and
  // every overlay scales with it, so the chrome can never drift off the
  // graphics regardless of the Observatory container's shape
  // (§2 real-container-target, L82 bounded-embed).
  //
  // These are PRE-STREAM DEFAULTS ONLY (the classic arena's 1235×659). The game
  // serves many map shapes — a four-team board is SQUARE (2496² / 4992²) — so
  // the real native size arrives on every frame and syncBoardAspect re-layouts
  // the stage when it differs. Leaving them hard-coded pillarboxes a square
  // board inside a 1.874:1 stage with dead bands either side.
  var BOARD_W = 1235, BOARD_H = 659;
  var BOARD_ASPECT = BOARD_W / BOARD_H;
  function syncBoardAspect(s) {
    if (!s || !(s.boardW > 1) || !(s.boardH > 1)) return;
    var aspect = s.boardW / s.boardH;
    if (Math.abs(aspect - BOARD_ASPECT) < 0.001) return;
    BOARD_W = s.boardW; BOARD_H = s.boardH; BOARD_ASPECT = aspect;
    relayout();
  }

  // ---- flag icon svg (HOME/TAKEN/CAPTURED — F2; captured draws as taken) ----
  function buildFlag(el, color) {
    el.innerHTML =
      '<svg viewBox="0 0 26 30" aria-hidden="true">' +
      '<rect x="4" y="2" width="2" height="26" fill="#2a1f16"/>' +
      '<g class="cloth"><path d="M6 3 L22 3 L18 9 L22 15 L6 15 Z" fill="' + color + '"/></g>' +
      '<rect x="1" y="26" width="10" height="3" fill="#8a7f72"/>' +
      '</svg>' +
      '<div class="carrier-tag"></div>';
  }

  // (speed chips are built + rendered by the shared chrome via ctx.send)

  // ---- core (board renderer + WS) ----
  var lastState = null;
  // PAINTBALL mode: latched on the first frame that carries a squad-game
  // field (`regime` only rides squad frames). Classic frames never set it.
  var MC_MODE = false;
  var MC_CTX = null;             // filled at the end of this IIFE (hoisted)
  // A scrubber click that arrives before the first chrome frame used to be
  // DROPPED: click-to-seek needs [startTick, maxTick] off the frame to map the
  // x-fraction onto a tick, and the handler simply returned when there was no
  // frame yet. The fraction is remembered instead and resolved on the first
  // frame that carries the axis — the same one-shot shape as ?t=.
  var SEEK_FRAC = null;
  var replayAdapter = window.CtfStaticReplay || null;
  var coreConfig = {
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); syncViewUi(); },
    // The core owns the view, so it tells the controls where it ended up —
    // never the other way round. That keeps the slider honest when the zoom
    // moved for some other reason (a pinch, an arrow key, a refit, a new board).
    onTransform: function (t) { syncViewUi(t); }
  };
  var core = replayAdapter
    ? replayAdapter.createCore(coreConfig)
    : window.BroadcastCore.create(coreConfig);

  // Tell the League Replayer shell the board is alive and showing its
  // locker-room curtain, so the shell can drop its own "loading replay…"
  // toast (which would float mid-scene) and give a slow wasm boot a longer
  // leash before escalating to the load-failure card.
  postToShell('boot');

  function send(cmd) { core.sendCommand(cmd); }

  // Transport commands relayed DOWN from the League Replayer shell (embed mode):
  // the shell's wall-mounted transport buttons/scrubber postMessage a command
  // string, which we forward to the single shared replay websocket. Same command
  // vocabulary the local transport uses, so the shell drives playback 1:1.
  if (EMBED) {
    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || m.src !== 'ctf-shell') return;
      if (m.type === 'cmd' && typeof m.cmd === 'string') send(m.cmd);
      else if (m.type === 'seek' && m.tick != null) send('s:' + m.tick);
      else if (m.type === 'pov' && m.slot != null) send('v:' + m.slot);
    });
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  var lastFf = false;   // previous frame's fast-forward flag (jump detection)
  // (beat markers, lull spans, beats timeline and momentum state live in the
  // shared chrome closure — see chrome_common.js)

  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    lastState = s;
    if (!MC_MODE && s.mc !== undefined) MC_MODE = true;
    dismissLockerRoom();  // the board is live — fade the pre-load curtain

    if (SEEK_T != null) { send('s:' + SEEK_T); SEEK_T = null; }
    if (SEEK_FRAC != null && s.en) { seekToFraction(s, SEEK_FRAC); SEEK_FRAC = null; }
    applyAchievementFocus(s);

    // The board's real native size, read off the core's letterbox transform.
    // THIS page re-layouts its own stage to it (syncBoardAspect) and it also
    // rides along to the League Replayer shell (embed mode), which reads
    // roster/KDA, clock, lives, flags and pov straight off this frame to paint
    // the wall-mounted scorebug + KDA tables in lockstep with the board — and
    // tracks the same aspect with its own syncBoardAspect.
    if (core) {
      var bt = core.getTransform();
      if (bt.nativeW > 1 && bt.nativeH > 1) { s.boardW = bt.nativeW; s.boardH = bt.nativeH; }
    }
    syncBoardAspect(s);
    postToShell('frame', s);

    // Detect a jump (seek/loop): clear transient beats so nothing phantoms.
    // A skip-lulls fast-forward frame legitimately advances up to 64 ticks
    // (this frame or the previous one, which may have crossed OUT of the
    // lull), so widen the expected stride accordingly instead of misreading
    // the boost as a seek.
    var stride = (s.ff || lastFf) ? Math.min((s.sp || 1) * 8, 64) : (s.sp || 1);
    var jumped = (s.t < lastTick) || (lastTick >= 0 && s.t - lastTick > stride * 4 + 2);
    if (jumped) { clearFeed(); clearBanners(); }
    lastFf = !!s.ff;

    renderScorebug(s);
    renderClock(s);
    renderTransport(s);
    renderPov(s);
    renderMismatch(s);

    if (s.events && s.events.length && !jumped) {
      for (var i = 0; i < s.events.length; i++) applyEvent(s.events[i], s);
    }
    // Even on a jump, register beat markers we can place from state? Markers
    // come from events only; on a jump the tracker resync'd (no events), so we
    // keep whatever markers we already collected.
    ingestLeadSeries(s);
    ingestFpMap(s);
    ingestLullSpans(s);
    ingestBeats(s);
    ingestCapHearts(s);
    recordMomentum(s);

    if (s.ph === 'gameover') { renderEndcard(s); if (s.over) setVerdict(s.over); }
    else { $('endcard').classList.remove('on'); }

    // PAINTBALL additions run last, over the classic chrome's own render.
    if (MC_MODE && window.MinecraftChrome) window.MinecraftChrome.frame(s, MC_CTX, jumped);

    lastTick = s.t;
  }

  // (ingestLeadSeries / ingestLullSpans / ingestBeats / setVerdict live in the
