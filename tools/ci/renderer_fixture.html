<!DOCTYPE html>
<html lang="en" data-fixture="pending">
<head>
<meta charset="utf-8">
<title>minecraft renderer fixture</title>
<style>
  html, body { margin: 0; background: #0b0a08; color: #f2e8d8;
    font: 12px/1.4 system-ui, sans-serif; }
  #frame { display: block; border: 0; background: #000; }
  #log { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  The renderer fixture.

  docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so the CI replay's seat plays
  scripted and emits no `say` at all - the smoke replay can therefore never
  exercise the feed's narration path (the cogchemists 2026-08-24 scar). This
  page LOADS THE SHIPPED dist/static-replay-viewer/index.html IN AN IFRAME and
  drives the real drawing code through the one hook the appended game block
  exports (`MinecraftChrome.__fixture`). It does NOT re-implement any drawing
  (the particle-worlds 2026-08-26 scar): every pixel it checks is painted by
  the bundle the platform will serve.

  Driven scenarios, at several canvas widths INCLUDING 360 px:
    * a full-cap 160-rune `say` in the feed,
    * all 11 ladder chips locked, then all 11 lit,
    * the strata gauge at each of the four depths,
    * a lava-death endcard, an `11 OF 11` diamond endcard, and a turnCap
      endcard.

  It ASSERTS ITS OWN STRINGS. A fixture that quietly renders a shortened
  remark passes while testing nothing, so after every scenario it reads the
  narration row back OUT of the iframe and fails unless the drawn string is
  the full-cap 160-rune say, character for character, in a row that is not
  clipped and whose box is inside the frame. That check is the DOM half of
  `viewer_smoke.mjs --strict-text-bounds`: this viewer draws NO canvas text at
  all (there is no fillText/strokeText in the page or in broadcast_core.js,
  asserted by tests/test_minecraft_viewer.nim), so the canvas_text counters
  are legitimately 0 and the strings that can go missing are DOM strings.

  Signals, so `viewer_smoke.mjs --url <this page> --strict-text-bounds` is the
  harness that drives it: data-replay-loaded="true" on <html> when every
  scenario drew and every assertion held, data-replay-error="<message>" on the
  first failure. (data-fixture / data-fixture-error carry the same verdict.)
-->
<iframe id="frame" width="960" height="540"></iframe>
<div id="log">starting…</div>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log');
  var frame = document.getElementById('frame');
  var WIDTHS = [960, 640, 360];
  var lines = [];

  function say(text) {
    lines.push(text);
    log.textContent = lines.join('\n');
  }

  function fail(message) {
    document.documentElement.setAttribute('data-fixture-error', String(message));
    document.documentElement.setAttribute('data-fixture', 'failed');
    // The signal viewer_smoke.mjs reads. Both are set: the fixture must fail
    // whichever harness is pointed at it.
    document.documentElement.setAttribute('data-replay-error', String(message));
    say('FAIL ' + message);
    if (window.console) console.error('fixture: ' + message);
  }

  function ladder(litUpTo) {
    var ids = ['log', 'planks', 'crafting_table', 'wooden_pickaxe',
      'cobblestone', 'stone_pickaxe', 'iron_ore', 'furnace', 'iron_ingot',
      'iron_pickaxe', 'diamond'];
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      out.push({ id: ids[i], p: 1 << i, t: i < litUpTo ? 14 + i * 30 : -1 });
    }
    return out;
  }

  function view(size, glyph) {
    var rows = [];
    for (var y = 0; y < size; y++) {
      var row = '';
      for (var x = 0; x < size; x++) {
        row += (x === (size >> 1) && y === (size >> 1)) ? '@' : glyph;
      }
      rows.push(row);
    }
    return rows;
  }

  // A full-cap say: EXACTLY MaxSayRunes = 160 runes, two of them 4-byte
  // emoji, so the feed row is exercised at exactly the cap sanitizeSay
  // truncates to and a shortened render is visible as a length mismatch.
  var MAX_SAY_RUNES = 160;
  var FULL_SAY = (function () {
    var s = '';
    while (s.length < 158) s += 'iron in the wall and a table already down - ';
    return s.slice(0, 158) + '\u{1F600}\u{1F600}';
  })();
  var SAY_RUNES = Array.from(FULL_SAY).length;

  function state(opts) {
    var z = opts.z || 0;
    var lit = opts.lit === undefined ? 6 : opts.lit;
    var s = {
      t: opts.tick || 401, mt: 960, ph: opts.ph || 'playing', lob: 0,
      pl: true, sp: 1, mx: 960, st: 0, lp: true, sk: false, ff: false,
      en: true, mm: -1, bs: 1, pov: -1, turnTicks: 20,
      teams: { red: { lives: lit, prog: (1 << lit) - 1, policies: ['daveey'] } },
      roster: [{ s: 0, name: 'daveey', alias: 'Alpha', pol: 'daveey',
                 team: 'red', alive: true, lives: lit, kind: 'llm' }],
      events: [],
      directives: [{ turn: opts.turn || 21, slot: 0, source: opts.source || 'llm',
                     say: opts.say === undefined ? FULL_SAY : opts.say }],
      beats: opts.beats || [],
      mc: {
        x: 12, y: 19, z: z, facing: 'east',
        level: ['y=64', 'y=48', 'y=32', 'y=12'][z],
        levelLabel: 'level', tier: 2, alive: opts.alive !== false,
        size: 32, levels: 4,
        inv: { log: 1, planks: 5, stick: 4, cobblestone: 14, coal: 3,
               raw_iron: 0, iron_ingot: 0, diamond: lit > 10 ? 1 : 0 },
        tools: { wooden_pickaxe: lit > 3, stone_pickaxe: lit > 5,
                 iron_pickaxe: lit > 9 },
        ms: ladder(lit), n: lit, of: 11,
        score: 1000 * ((1 << lit) - 1) + 119, mscore: (1 << lit) - 1,
        speed: 119, deepest: z,
        shafts: [[0, 16, 16], [1, 16, 16], [2, 13, 19]],
        ore: [{ w: 'coal ore', z: 1, x: 20, y: 7 },
              { w: 'iron ore', z: 2, x: 13, y: 19 },
              { w: 'diamond ore', z: 3, x: 9, y: 21 }],
        view: view(z === 0 ? 11 : 5, z === 0 ? '.' : '#'),
        vr: z === 0 ? 5 : 2, seen: 412, cells: 4096,
        mined: 184, built: 2, crafted: 9, smelted: 0, dug: 2, bridges: 1,
        interrupts: 3, fallbacks: opts.fallbacks || 1,
        turn: opts.turn || 21, turns: 48, death: opts.death || 'none'
      }
    };
    if (opts.ph === 'gameover') {
      s.over = {
        winner: lit >= 6 ? 'red' : '', draw: false, timeLimit: true,
        teams: { red: { lives: lit, prog: (1 << lit) - 1 } },
        endRule: opts.endRule || 'turnCap', reason: 'complete',
        milestones: lit, of: 11, score: 1000 * ((1 << lit) - 1) + 119,
        deepest: ['y=64', 'y=48', 'y=32', 'y=12'][z], tick: opts.tick || 960,
        death: opts.death || 'none'
      };
    }
    return s;
  }

  var SCENARIOS = [
    { name: 'surface, nothing lit, full-cap say',
      opts: { z: 0, lit: 0, turn: 1 } },
    { name: 'stone level, six rungs', opts: { z: 1, lit: 6, turn: 12 } },
    { name: 'iron depth, nine rungs, fallback glyph',
      opts: { z: 2, lit: 9, turn: 30, source: 'fallback', fallbacks: 4 } },
    { name: 'diamond depth, every chip lit', opts: { z: 3, lit: 11, turn: 40 } },
    { name: 'turnCap endcard',
      opts: { z: 2, lit: 8, ph: 'gameover', endRule: 'turnCap', tick: 960 } },
    { name: 'lava-death endcard',
      opts: { z: 2, lit: 5, ph: 'gameover', endRule: 'death', tick: 388,
              death: 'lava', alive: false, say: '' } },
    { name: '11 OF 11 diamond endcard',
      opts: { z: 3, lit: 11, ph: 'gameover', endRule: 'diamond', tick: 604 } }
  ];

  var BEATS = [
    { k: 'milestone', t: 14, id: 'log', n: 1, of: 11 },
    { k: 'newdepth', t: 21, to: 'y=48' },
    { k: 'fallback', t: 200, cause: 'timeout' },
    { k: 'death', t: 388 },
    { k: 'end', t: 960, milestones: 8 }
  ];

  function settle(ms) {
    // A layout frame plus `ms`. Two things need it: the page's own relayout()
    // runs on the iframe's resize event and toggles #stage.tiny, and a fresh
    // feed row PLAYS AN ENTRANCE ANIMATION (`feedin`, 250 ms, starting 30u to
    // the right). Measuring a row mid-slide would report a box outside the
    // frame that is outside by design, which is exactly the distinction
    // viewer_smoke.mjs draws between `outside` and `never_inside`, so every
    // geometry read below happens after the animation has settled.
    return new Promise(function (resolve) {
      requestAnimationFrame(function () { setTimeout(resolve, ms || 50); });
    });
  }

  // THE FIXTURE ASSERTS ITS OWN STRINGS. Read the narration row back out of
  // the iframe: the drawn text must be the whole 160-rune say, the row must
  // not be clipped, and its box must be inside the frame. A quietly shortened
  // remark is exactly what leaves a fixture passing while testing nothing.
  //
  // `redraw` is handed in because the feed is a QUEUE with a dwell timer: a
  // row is removed a second or two after it lands, and a resize re-lays the
  // whole chrome out, so a measurement that comes back degenerate is redrawn
  // and re-measured rather than trusted.
  function inspectNarration(doc, expected) {
    var span = doc.querySelector('#killfeed .feed-row .mc-say');
    if (!span) return { ok: false, why: 'no narration row in the feed' };
    var drawn = span.textContent.replace(/^\u201c/, '').replace(/\u201d$/, '');
    if (drawn !== expected) {
      return { ok: false, hard: true, why: 'the drawn say is ' +
        Array.from(drawn).length + ' runes, the state carried ' +
        Array.from(expected).length };
    }
    var row = span.parentNode;
    while (row && String(row.className || '').indexOf('feed-row') < 0) {
      row = row.parentNode;
    }
    if (!row) return { ok: false, hard: true, why: 'the say is not in a row' };
    var rect = row.getBoundingClientRect();
    var win = doc.defaultView;
    if (rect.width < 1 || rect.height < 1) {
      var feed = doc.getElementById('killfeed');
      var stage = doc.getElementById('stage');
      return { ok: false, why: 'the narration row has no box (' +
        rect.width + 'x' + rect.height + '); display=' +
        win.getComputedStyle(row).display + ' opacity=' +
        win.getComputedStyle(row).opacity + ' offsetParent=' +
        (row.offsetParent ? 'yes' : 'null') + ' feed=' +
        (feed ? JSON.stringify(feed.getBoundingClientRect().width) : 'gone') +
        ' stage=' + (stage ? stage.className + ' ' +
        JSON.stringify(stage.getBoundingClientRect().width) : 'gone') +
        ' --u=' + win.getComputedStyle(doc.documentElement)
          .getPropertyValue('--hudscale') };
    }
    if (row.scrollHeight > row.clientHeight + 2 ||
        row.scrollWidth > row.clientWidth + 2) {
      return { ok: false, hard: true, why: 'the narration row is CLIPPED: ' +
        row.scrollWidth + 'x' + row.scrollHeight + ' of text in a ' +
        row.clientWidth + 'x' + row.clientHeight + ' box - a sentence that ' +
        'ellipsises is a box that is too small' };
    }
    if (rect.top < -1 || rect.left < -1 ||
        rect.bottom > win.innerHeight + 1 || rect.right > win.innerWidth + 1) {
      return { ok: false, why: 'the narration row is outside the frame: ' +
        JSON.stringify([rect.left, rect.top, rect.right, rect.bottom]) +
        ' in ' + win.innerWidth + 'x' + win.innerHeight };
    }
    return { ok: true, runes: Array.from(drawn).length };
  }

  async function checkNarration(doc, width, name, expected, redraw) {
    var last = null;
    for (var attempt = 0; attempt < 4; attempt++) {
      last = inspectNarration(doc, expected);
      if (last.ok) return last.runes;
      if (last.hard) break;
      redraw();
      await settle(400);
    }
    throw new Error(last.why + ' ("' + name + '" at ' + width + 'px)');
  }

  function checkEndcard(doc, width, name, opts) {
    var head = doc.getElementById('ec-headline');
    if (!head || !head.textContent.trim()) {
      throw new Error('the endcard headline is empty for "' + name + '"');
    }
    if (head.textContent.indexOf(String(opts.tick)) < 0) {
      throw new Error('the endcard headline for "' + name + '" does not ' +
        'carry its tick: "' + head.textContent + '"');
    }
  }

  async function drive(win) {
    var chrome = win.MinecraftChrome;
    if (!chrome || typeof chrome.__fixture !== 'function') {
      throw new Error('the bundle exposes no MinecraftChrome.__fixture hook');
    }
    if (SAY_RUNES !== MAX_SAY_RUNES) {
      throw new Error('the fixture\'s own say is ' + SAY_RUNES +
        ' runes, not the ' + MAX_SAY_RUNES + '-rune cap it must exercise');
    }
    var doc = win.document;
    for (var w = 0; w < WIDTHS.length; w++) {
      frame.width = WIDTHS[w];
      frame.height = Math.round(WIDTHS[w] * 9 / 16);
      // The page re-lays out on its own ResizeObserver, so wait for the stage
      // to come back with a real box before drawing into it.
      await settle(150);
      for (var tries = 0; tries < 20; tries++) {
        var stage = doc.getElementById('stage');
        if (stage && stage.getBoundingClientRect().width > 1) break;
        await settle(150);
      }
      for (var i = 0; i < SCENARIOS.length; i++) {
        var opts = SCENARIOS[i].opts;
        opts.beats = BEATS;
        var expected = opts.say === undefined ? FULL_SAY : opts.say;
        chrome.__fixture(state(opts));
        await settle(320);          // let `feedin` finish before measuring
        var runes = 0;
        if (expected) {
          runes = await checkNarration(doc, WIDTHS[w], SCENARIOS[i].name,
            expected, (function (drawOpts) {
              return function () { chrome.__fixture(state(drawOpts)); };
            })(opts));
        }
        if (opts.ph === 'gameover') {
          checkEndcard(doc, WIDTHS[w], SCENARIOS[i].name, opts);
        }
        say('drew "' + SCENARIOS[i].name + '" at ' + WIDTHS[w] + 'px' +
          (runes ? ' (' + runes + ' runes of say, unclipped)' : ''));
      }
    }
  }

  function start() {
    var win = frame.contentWindow;
    var tries = 0;
    // WAIT FOR A REAL FRAME FIRST. The game block only receives the page's
    // chrome context on its first frame (the page's own IIFE runs BEFORE the
    // appended block defines window.MinecraftChrome, so install() never
    // fires), so driving it any earlier reads `esc` off undefined. The
    // bundle's own data-replay-loaded="true" is exactly the "a frame is on
    // the canvas" signal to wait on.
    (function poll() {
      tries++;
      try {
        var doc = frame.contentDocument;
        var ready = doc &&
          doc.documentElement.getAttribute('data-replay-loaded') === 'true';
        var failed = doc &&
          doc.documentElement.getAttribute('data-replay-error');
        if (failed) {
          fail('the viewer bundle failed to load: ' + failed);
          return;
        }
        if (ready && win.MinecraftChrome) {
          drive(win).then(function () {
            document.documentElement.setAttribute('data-fixture', 'ok');
            // The signal viewer_smoke.mjs waits for. It is set ONLY after
            // every scenario drew and every string assertion held.
            document.documentElement.setAttribute('data-replay-loaded', 'true');
            say('OK ' + (WIDTHS.length * SCENARIOS.length) +
              ' frames drawn, ' + SAY_RUNES + '-rune say intact at every width');
          }, function (error) {
            fail(error && error.message ? error.message : String(error));
          });
          return;
        }
      } catch (error) {
        fail(error && error.message ? error.message : String(error));
        return;
      }
      if (tries > 400) {
        fail('the viewer bundle never drew a frame (data-replay-loaded)');
        return;
      }
      setTimeout(poll, 100);
    })();
  }

  frame.addEventListener('load', start);
  // The replay URL is appended by tools/ci/fixture_smoke.mjs so the bundle
  // boots exactly the way the platform boots it.
  var replay = new URLSearchParams(location.search).get('replay') || '';
  frame.src = './index.html?replay=' + encodeURIComponent(replay) + '&spoilers=1';
})();
</script>
</body>
</html>
